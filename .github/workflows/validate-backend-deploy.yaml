name: Validate shared backend deploy workflow

on:
  pull_request:
    paths:
      - .github/tests/buildkit-mtls-client.test.rb
      - .github/tests/deploy-gate-contract.test.rb
      - .github/tests/deploy-backend-loop.test.rb
      - .github/tests/discord-deploy-in-job.test.rb
      - .github/workflows/deploy-backend.yaml
      - .github/workflows/deploy-cloudrun.yaml
      - .github/workflows/discord-notify.yaml
      - .github/workflows/validate-backend-deploy.yaml
  push:
    branches: [main]
    paths:
      - .github/tests/buildkit-mtls-client.test.rb
      - .github/tests/deploy-gate-contract.test.rb
      - .github/tests/deploy-backend-loop.test.rb
      - .github/tests/discord-deploy-in-job.test.rb
      - .github/workflows/deploy-backend.yaml
      - .github/workflows/deploy-cloudrun.yaml
      - .github/workflows/discord-notify.yaml
      - .github/workflows/validate-backend-deploy.yaml

permissions:
  contents: read

jobs:
  buildkit-mtls-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # Client half of the CEL-1513 invariant. The server half is
      # scripts/verify_buildkit_mtls.py in CellarNode/crossplane-gcloud; both
      # halves have to hold for the control to exist.
      - name: Test BuildKit mTLS client contract
        run: ruby .github/tests/buildkit-mtls-client.test.rb

  deploy-gate-contract:
    # CEL-2322: production deploys only from main. Evaluates the `deploy` job condition of BOTH shared workflows over the
    # event x ref x argocd_deploy truth table, pins the branch-tag slug, and proves the table catches mutations.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test the production deploy gate contract
        run: ruby .github/tests/deploy-gate-contract.test.rb

  deploy-backend-loop:
    # CEL-2795: executes the single-job deploy loop under bash with a stub argocd (order, stop at first failure, retry, shell: bash).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test the deploy loop behaviour
        run: ruby .github/tests/deploy-backend-loop.test.rb

  discord-deploy-in-job:
    # CEL-2795: the backend deploy notification is the last step of build/deploy, not a job that holds the caller's concurrency group.
    # Executes the inlined script under node (stubbed GitHub and Discord), keeps it a verbatim subset of discord-notify.yaml, and mutates
    # the workflow contract to prove each check can fail.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test the in-job deploy notification
        run: ruby .github/tests/discord-deploy-in-job.test.rb
