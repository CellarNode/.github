name: Build and Deploy Backend

on:
  workflow_call:
    inputs:
      app_name:
        description: "Application name (used for image names and ArgoCD app prefix)"
        required: true
        type: string
      docker_targets:
        description: "JSON array of Docker build targets, e.g. [\"unified\", \"worker\"]"
        required: true
        type: string
      flavors:
        description: "JSON array of deploy flavors, e.g. [\"admin\", \"public\", \"worker-extraction\"]"
        required: true
        type: string
      deploy_path:
        description: "ArgoCD kustomize path prefix in crossplane-gcloud repo"
        required: false
        type: string
        default: "./deploy/installations"
      argocd_project:
        description: "ArgoCD project name"
        required: false
        type: string
        default: "products"
      worker_image_prefix:
        description: "Flavor prefix that maps to the worker Docker target (e.g. 'worker' matches worker-*)"
        required: false
        type: string
        default: "worker"
      discord_tags:
        description: "Comma-separated Discord forum tag names (e.g. backend,infra)"
        required: false
        type: string
        default: ""
    secrets:
      NPM_TOKEN:
        description: "npm token forwarded into Docker build via --secret for private @cellarnode/* installs"
        required: false
      DISCORD_WEBHOOK_URL:
        description: "Discord webhook credential"
        required: false

env:
  CONTAINER_REGISTRY: europe-north1-docker.pkg.dev
  PROJECT_ID: festive-terrain-478011-h0
  CONTAINER_REPOSITORY: beveriq

jobs:
  build:
    # Same-repo builds run in-cluster against the shared rootless buildkitd:
    # AR pulls/pushes and the type=registry buildx cache ride Private Google
    # Access (free, in-region) instead of billing AR internet egress from
    # GitHub-hosted runners. Fork PRs are untrusted and must NOT run on
    # self-hosted runners — they build on GitHub-hosted in build-fork below.
    if: >-
      github.event.action != 'closed' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted-k8s
    container:
      image: europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner:latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    # ARC's kubernetes-mode hook runs `run:` steps with plain `sh` (dash),
    # which chokes on bashisms like ${GITHUB_SHA::7} ("Bad substitution").
    # GitHub-hosted runners defaulted to bash — pin it explicitly.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image_tag=pr-${{ github.event.pull_request.number }}-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "push_latest=false" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "push_latest=true" >> $GITHUB_OUTPUT
            else
              echo "push_latest=false" >> $GITHUB_OUTPUT
            fi
          fi

      # CEL-1513 step 1 of 3 — mutual TLS on the shared buildkitd, with a
      # plaintext fallback. Server side is CellarNode/crossplane-gcloud#78
      # (runbook: docs/buildkit-mtls.md there).
      #
      # buildkitd applies TLS per listener and one daemon cannot serve
      # plaintext and TLS on the same TCP port, so the server cutover is
      # atomic and it spans two repos. This step lands FIRST and is correct on
      # both sides of it:
      #
      #   - server plaintext (today): the client leaf is not in the cluster
      #     yet, /run/buildkit/certs is absent, the guard is false, and the
      #     plaintext create runs exactly as before.
      #   - server TLS (after #78 syncs): ARC's container-hook extension mounts
      #     the client leaf into every job pod at /run/buildkit/certs, the
      #     guard is true, and the mTLS builder bootstraps.
      #   - mid-sync, either order: whichever path fails the handshake falls
      #     through to the other, and if neither connects the step fails here
      #     rather than at the first build.
      #
      # `docker buildx create` does not dial the daemon — it only records the
      # endpoint. `inspect --bootstrap` is what performs the handshake, so
      # both paths are keyed on it and not on create's exit status.
      #
      # Certificate file names are cert-manager's (ca.crt / tls.crt / tls.key)
      # and the paths must be absolute. No `servername` override: the server
      # leaf's SAN list covers the FQDN dialled below.
      #
      # STEP 3 of 3 removes the fallback branch, leaving only the mTLS path.
      # Until it does, a server-side regression that dropped --tlscacert would
      # silently downgrade CI to plaintext instead of failing the build.
      # .github/tests/buildkit-mtls-client.test.rb pins that transition: flip
      # PLAINTEXT_FALLBACK_EXPECTED there in the same commit.
      - name: Connect to in-cluster buildkitd
        env:
          BUILDKITD_ADDR: tcp://buildkitd.buildkit.svc.cluster.local:1234
          BUILDKITD_CERT_DIR: /run/buildkit/certs
        run: |
          set -euo pipefail

          recreate() {
            docker buildx rm k8s-buildkit >/dev/null 2>&1 || true
            docker buildx create --name k8s-buildkit --driver remote "$@" \
              "$BUILDKITD_ADDR" --use
          }

          connected=false

          if [ -r "${BUILDKITD_CERT_DIR}/ca.crt" ] \
            && [ -r "${BUILDKITD_CERT_DIR}/tls.crt" ] \
            && [ -r "${BUILDKITD_CERT_DIR}/tls.key" ]; then
            echo "buildkitd client certificate found - connecting with mutual TLS"
            recreate \
              --driver-opt "cacert=${BUILDKITD_CERT_DIR}/ca.crt" \
              --driver-opt "cert=${BUILDKITD_CERT_DIR}/tls.crt" \
              --driver-opt "key=${BUILDKITD_CERT_DIR}/tls.key"
            if docker buildx inspect --bootstrap k8s-buildkit; then
              connected=true
            else
              echo "::warning title=buildkitd mTLS handshake failed::Falling back to plaintext (CEL-1513 step 1 of 3). If buildkitd is already TLS-only this build will fail at connect - re-run it."
            fi
          else
            echo "no buildkitd client certificate at ${BUILDKITD_CERT_DIR} - using plaintext (CEL-1513 step 1 of 3)"
          fi

          if [ "$connected" != true ]; then
            recreate
            docker buildx inspect --bootstrap k8s-buildkit
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: "projects/1040576468442/locations/global/workloadIdentityPools/iamwipp-pipelines/providers/iamwipp-github-pipelines-beveriq"
          service_account: "pipelines@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"
          token_format: "access_token"

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push images
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARGETS: ${{ inputs.docker_targets }}
          APP: ${{ inputs.app_name }}
        run: |
          TAG='${{ steps.vars.outputs.image_tag }}'
          PUSH_LATEST='${{ steps.vars.outputs.push_latest }}'
          REGISTRY="${{ env.CONTAINER_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.CONTAINER_REPOSITORY }}"
          CACHE_REF="${REGISTRY}/${APP}-cache:latest"

          FIRST=true
          for TARGET in $(echo "$TARGETS" | jq -r '.[]'); do
            IMAGE="${REGISTRY}/${APP}-${TARGET}"

            CACHE_TO_ARG=""
            if [ "$FIRST" = true ]; then
              CACHE_TO_ARG="--cache-to=type=registry,ref=${CACHE_REF},mode=max"
              FIRST=false
            fi

            # CEL-175: BACKEND_GIT_SHA is consumed by Dockerfiles that declare
            # `ARG BACKEND_GIT_SHA` so the runtime can stamp the deployed
            # commit into application metadata (e.g. cellarnode-backend-v2's
            # OpenAPI emit at info["x-backend-sha"], CEL-174). Universal-safe:
            # if a service's Dockerfile doesn't declare the ARG, docker
            # buildx warns about an unused build-arg but the build succeeds.
            TAGS="--tag ${IMAGE}:${TAG}"
            if [ "$PUSH_LATEST" = "true" ]; then
              TAGS="${TAGS} --tag ${IMAGE}:latest"
            fi

            docker buildx build \
              --file ./Dockerfile \
              --target "$TARGET" \
              --push \
              ${TAGS} \
              --build-arg "BACKEND_GIT_SHA=${GITHUB_SHA}" \
              --secret id=NPM_TOKEN,env=NPM_TOKEN \
              --cache-from="type=registry,ref=${CACHE_REF}" \
              $CACHE_TO_ARG \
              .
          done

  # Fork PRs: validate the build on GitHub-hosted runners — no cluster access,
  # no WIF auth, no push, no secrets. Untrusted code must not reach
  # self-hosted runners.
  build-fork:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (no push)
        shell: bash
        env:
          TARGETS: ${{ inputs.docker_targets }}
        run: |
          for TARGET in $(echo "$TARGETS" | jq -r '.[]'); do
            docker buildx build \
              --file ./Dockerfile \
              --target "$TARGET" \
              .
          done

  deploy:
    runs-on: self-hosted-k8s
    # ci-runner ships the argocd CLI (v3.2.1) and jq; nothing is downloaded
    # through NAT per run.
    container:
      image: europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner:latest
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        flavor: ${{ fromJson(inputs.flavors) }}

    steps:
      - name: Deploy ${{ matrix.flavor }} to ArgoCD
        env:
          ARGOCD_AUTH_TOKEN: ${{ vars.ARGO_API_KEY }}
          ARGOCD_URL: argo.anli.es
          APP: ${{ inputs.app_name }}
          FLAVOR: ${{ matrix.flavor }}
          WORKER_PREFIX: ${{ inputs.worker_image_prefix }}
          DOCKER_TARGETS: ${{ inputs.docker_targets }}
        run: |
          REGISTRY="${{ env.CONTAINER_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.CONTAINER_REPOSITORY }}"
          TAG="${{ needs.build.outputs.image_tag }}"

          # Map flavor to Docker target image.
          # CEL-609: if the flavor name is itself one of docker_targets (e.g.
          # `elabel`), deploy that target's image directly. This generalizes the
          # previous "first non-worker target" default, which assumed exactly one
          # non-worker target and would mis-route a 2nd app's flavor to the wrong
          # image. Backward-compatible: flavors that don't match a target name
          # (admin, public, worker-*) keep the legacy mapping below.
          if echo "$DOCKER_TARGETS" | jq -e --arg f "$FLAVOR" 'index($f) != null' >/dev/null; then
            IMAGE_NAME="${APP}-${FLAVOR}"
          else
            case "$FLAVOR" in
              ${WORKER_PREFIX}-*) IMAGE_NAME="${APP}-${WORKER_PREFIX}" ;;
              *)
                # Use first non-worker target as the default image
                FIRST_TARGET=$(echo "$DOCKER_TARGETS" | jq -r --arg w "$WORKER_PREFIX" '[.[] | select(. != $w)][0]')
                IMAGE_NAME="${APP}-${FIRST_TARGET}"
                ;;
            esac
          fi

          argocd app create --upsert ${APP}-${FLAVOR} --server $ARGOCD_URL \
            --project ${{ inputs.argocd_project }} \
            --repo git@github.com:CellarNode/crossplane-gcloud.git \
            --path ${{ inputs.deploy_path }}/${APP}-${FLAVOR}/ \
            --dest-server https://kubernetes.default.svc \
            --dest-namespace ${APP}-${FLAVOR} \
            --kustomize-image "app-image=${REGISTRY}/${IMAGE_NAME}:${TAG}" \
            --kustomize-common-label app.kubernetes.io/name=${APP}-${FLAVOR} \
            --nameprefix=${FLAVOR}- \
            --sync-policy auto \
            --sync-option CreateNamespace=true \
            --sync-option PruneLast=true

  # --- Discord thread lifecycle ---

  discord-thread-open:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_open
      tags: ${{ inputs.discord_tags }}

  discord-build-update:
    needs: [build, build-fork, discord-thread-open]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      needs.build.result != 'cancelled' &&
      needs['build-fork'].result != 'cancelled'
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_update
      # same-repo PRs run `build`; fork PRs run `build-fork` — report whichever ran
      status: ${{ needs.build.result != 'skipped' && needs.build.result || needs['build-fork'].result }}

  discord-thread-close:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_close
      status: ${{ github.event.pull_request.merged && 'merged' || 'closed' }}

  discord-deploy:
    needs: deploy
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: deploy
      status: ${{ needs.deploy.result }}
      tags: ${{ inputs.discord_tags }}
