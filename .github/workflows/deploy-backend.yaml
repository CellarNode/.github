name: Build and Deploy Backend

on:
  workflow_call:
    inputs:
      app_name:
        description: "Application name (used for image names and ArgoCD app prefix)"
        required: true
        type: string
      docker_targets:
        description: "JSON array of Docker build targets, e.g. [\"unified\", \"worker\"]"
        required: true
        type: string
      flavors:
        description: "JSON array of deploy flavors, e.g. [\"admin\", \"public\", \"worker-extraction\"]"
        required: true
        type: string
      deploy_path:
        description: "ArgoCD kustomize path prefix in crossplane-gcloud repo"
        required: false
        type: string
        default: "./deploy/installations"
      argocd_project:
        description: "ArgoCD project name"
        required: false
        type: string
        default: "products"
      worker_image_prefix:
        description: "Flavor prefix that maps to the worker Docker target (e.g. 'worker' matches worker-*)"
        required: false
        type: string
        default: "worker"
      discord_tags:
        description: "Comma-separated Discord forum tag names (e.g. backend,infra)"
        required: false
        type: string
        default: ""
      argocd_deploy:
        description: "CEL-2322: run the ArgoCD deploy job (`argocd app create --upsert`, needs ARGO_API_KEY). Set false for an app on the pull model (Argo CD Image Updater): the build still pushes the image, the cluster pulls it, and no ArgoCD credential is needed. Default true keeps every existing caller unchanged."
        required: false
        type: boolean
        default: true
    secrets:
      ARGO_API_KEY:
        description: "ArgoCD API token of the `github` account (org secret ARGO_API_KEY, CEL-2320). Optional so fork PRs (no secrets) still run the no-push build jobs; the deploy step fails fast when it is empty. Callers pass it explicitly or with `secrets: inherit`."
        required: false
      DISCORD_WEBHOOK_URL:
        description: "Discord webhook credential"
        required: false

env:
  CONTAINER_REGISTRY: europe-north1-docker.pkg.dev
  PROJECT_ID: festive-terrain-478011-h0
  CONTAINER_REPOSITORY: beveriq

jobs:
  build:
    # Same-repo builds run in-cluster against the shared rootless buildkitd:
    # AR pulls/pushes and the type=registry buildx cache ride Private Google
    # Access (free, in-region) instead of billing AR internet egress from
    # GitHub-hosted runners. Fork PRs are untrusted and must NOT run on
    # self-hosted runners — they build on GitHub-hosted in build-fork below.
    if: >-
      github.event.action != 'closed' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted-k8s
    container:
      image: europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner:latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    # ARC's kubernetes-mode hook runs `run:` steps with plain `sh` (dash),
    # which chokes on bashisms like ${GITHUB_SHA::7} ("Bad substitution").
    # GitHub-hosted runners defaulted to bash — pin it explicitly.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image_tag=pr-${{ github.event.pull_request.number }}-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "push_latest=false" >> $GITHUB_OUTPUT
          else
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "image_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
              echo "push_latest=true" >> $GITHUB_OUTPUT
            else
              # CEL-2322: a bare `<sha7>` tag means "built from main". Anything pull-based (Argo CD Image Updater,
              # allowTags ^[0-9a-f]{7}$) deploys the newest such tag, so a workflow_dispatch on another branch must
              # never produce one: tag it `branch-<slug>-<sha7>`, which that regex rejects.
              SLUG=$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9\n' '-' | tr -s '-' | sed 's/^-*//; s/-*$//' | cut -c1-30 | sed 's/-*$//')
              echo "image_tag=branch-${SLUG:-ref}-${SHORT_SHA}" >> $GITHUB_OUTPUT
              echo "push_latest=false" >> $GITHUB_OUTPUT
            fi
          fi

      # CEL-1513 step 1 of 3 — mutual TLS on the shared buildkitd, with a
      # plaintext fallback. Server side is CellarNode/crossplane-gcloud#78
      # (runbook: docs/buildkit-mtls.md there).
      #
      # buildkitd applies TLS per listener and one daemon cannot serve
      # plaintext and TLS on the same TCP port, so the server cutover is
      # atomic and it spans two repos. This step lands FIRST and is correct on
      # both sides of it:
      #
      #   - server plaintext (today): the client leaf is not in the cluster
      #     yet, /run/buildkit/certs is absent, the guard is false, and the
      #     plaintext create runs exactly as before.
      #   - server TLS (after #78 syncs): ARC's container-hook extension mounts
      #     the client leaf into every job pod at /run/buildkit/certs, the
      #     guard is true, and the mTLS builder bootstraps.
      #   - mid-sync, either order: whichever path fails the handshake falls
      #     through to the other, and if neither connects the step fails here
      #     rather than at the first build.
      #
      # `docker buildx create` does not dial the daemon — it only records the
      # endpoint. `inspect --bootstrap` is what performs the handshake, so
      # both paths are keyed on it and not on create's exit status.
      #
      # Certificate file names are cert-manager's (ca.crt / tls.crt / tls.key)
      # and the paths must be absolute. No `servername` override: the server
      # leaf's SAN list covers the FQDN dialled below.
      #
      # STEP 3 of 3 removes the fallback branch, leaving only the mTLS path.
      # Until it does, a server-side regression that dropped --tlscacert would
      # silently downgrade CI to plaintext instead of failing the build.
      # .github/tests/buildkit-mtls-client.test.rb pins that transition: flip
      # PLAINTEXT_FALLBACK_EXPECTED there in the same commit.
      - name: Connect to in-cluster buildkitd
        env:
          BUILDKITD_ADDR: tcp://buildkitd.buildkit.svc.cluster.local:1234
          BUILDKITD_CERT_DIR: /run/buildkit/certs
        run: |
          set -euo pipefail

          recreate() {
            docker buildx rm k8s-buildkit >/dev/null 2>&1 || true
            docker buildx create --name k8s-buildkit --driver remote "$@" \
              "$BUILDKITD_ADDR" --use
          }

          connected=false

          if [ -r "${BUILDKITD_CERT_DIR}/ca.crt" ] \
            && [ -r "${BUILDKITD_CERT_DIR}/tls.crt" ] \
            && [ -r "${BUILDKITD_CERT_DIR}/tls.key" ]; then
            echo "buildkitd client certificate found - connecting with mutual TLS"
            recreate \
              --driver-opt "cacert=${BUILDKITD_CERT_DIR}/ca.crt" \
              --driver-opt "cert=${BUILDKITD_CERT_DIR}/tls.crt" \
              --driver-opt "key=${BUILDKITD_CERT_DIR}/tls.key"
            if docker buildx inspect --bootstrap k8s-buildkit; then
              connected=true
            else
              echo "::warning title=buildkitd mTLS handshake failed::Falling back to plaintext (CEL-1513 step 1 of 3). If buildkitd is already TLS-only this build will fail at connect - re-run it."
            fi
          else
            echo "no buildkitd client certificate at ${BUILDKITD_CERT_DIR} - using plaintext (CEL-1513 step 1 of 3)"
          fi

          if [ "$connected" != true ]; then
            recreate
            docker buildx inspect --bootstrap k8s-buildkit
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: "projects/1040576468442/locations/global/workloadIdentityPools/iamwipp-pipelines/providers/iamwipp-github-pipelines-beveriq"
          service_account: "pipelines@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"
          token_format: "access_token"

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push images
        shell: bash
        env:
          TARGETS: ${{ inputs.docker_targets }}
          APP: ${{ inputs.app_name }}
        run: |
          TAG='${{ steps.vars.outputs.image_tag }}'
          PUSH_LATEST='${{ steps.vars.outputs.push_latest }}'
          REGISTRY="${{ env.CONTAINER_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.CONTAINER_REPOSITORY }}"
          CACHE_REF="${REGISTRY}/${APP}-cache:latest"

          FIRST=true
          for TARGET in $(echo "$TARGETS" | jq -r '.[]'); do
            IMAGE="${REGISTRY}/${APP}-${TARGET}"

            CACHE_TO_ARG=""
            if [ "$FIRST" = true ]; then
              CACHE_TO_ARG="--cache-to=type=registry,ref=${CACHE_REF},mode=max"
              FIRST=false
            fi

            # CEL-175: BACKEND_GIT_SHA is consumed by Dockerfiles that declare
            # `ARG BACKEND_GIT_SHA` so the runtime can stamp the deployed
            # commit into application metadata (e.g. cellarnode-backend-v2's
            # OpenAPI emit at info["x-backend-sha"], CEL-174). Universal-safe:
            # if a service's Dockerfile doesn't declare the ARG, docker
            # buildx warns about an unused build-arg but the build succeeds.
            TAGS="--tag ${IMAGE}:${TAG}"
            if [ "$PUSH_LATEST" = "true" ]; then
              TAGS="${TAGS} --tag ${IMAGE}:latest"
            fi

            docker buildx build \
              --file ./Dockerfile \
              --target "$TARGET" \
              --push \
              ${TAGS} \
              --build-arg "BACKEND_GIT_SHA=${GITHUB_SHA}" \
              --cache-from="type=registry,ref=${CACHE_REF}" \
              $CACHE_TO_ARG \
              .
          done

  # Fork PRs: validate the build on GitHub-hosted runners — no cluster access,
  # no WIF auth, no push, no secrets. Untrusted code must not reach
  # self-hosted runners.
  build-fork:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (no push)
        shell: bash
        env:
          TARGETS: ${{ inputs.docker_targets }}
        run: |
          for TARGET in $(echo "$TARGETS" | jq -r '.[]'); do
            docker buildx build \
              --file ./Dockerfile \
              --target "$TARGET" \
              .
          done

  deploy:
    runs-on: self-hosted-k8s
    container:
      image: europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner@sha256:b8ae250c5d7fae79dbbea1f62ca7613ecabd6f3efbd13b533cbdecb293cdf814
    needs: build
    # CEL-2322: PRODUCTION deploys only from main. A workflow_dispatch on another branch still builds and pushes its
    # `branch-<slug>-<sha7>` image (see the tag step), so that image stays available for a future preview/staging
    # environment, but it never reaches production: see `deploy-skipped-notice`.
    # `argocd_deploy: false` (pull-model apps, CEL-2322) skips this job and with it the ARGO_API_KEY requirement.
    if: >-
      inputs.argocd_deploy &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # CEL-2795: ONE job that upserts every flavor in a loop, not a matrix leg per flavor. The caller now cancels superseded
    # main deploys (cancel-in-progress), and with 6 matrix legs queueing on a 2-runner pool a cancel could leave some flavors
    # on the new tag and others on the old one (skew that persists if the superseding run then fails). Migrations run as
    # ArgoCD PreSync hooks only on the non-worker flavors (admin, public, elabel), so workers must never get ahead of the
    # schema: non-worker flavors are upserted FIRST, in input order, then the `<worker_image_prefix>-*` flavors. A cancel
    # between flavors can still stop the loop part-way, but it is seconds wide instead of runner-queue wide, and the
    # superseding run re-upserts every flavor. One job also saves 5 runner pod starts on the 2-runner pool.
    # Failure semantics match the old matrix (fail-fast defaulted to true): stop at the first failed flavor.
    steps:
      - name: Deploy flavors to ArgoCD (migrating flavors first)
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGO_API_KEY }}
          ARGOCD_URL: argo.anli.es
          APP: ${{ inputs.app_name }}
          FLAVORS: ${{ inputs.flavors }}
          WORKER_PREFIX: ${{ inputs.worker_image_prefix }}
          DOCKER_TARGETS: ${{ inputs.docker_targets }}
          ARGOCD_PROJECT: ${{ inputs.argocd_project }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          REGISTRY: ${{ env.CONTAINER_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.CONTAINER_REPOSITORY }}
          TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          # CEL-2320: ARGO_API_KEY is an optional workflow secret so fork PRs (no secrets) still reach the no-push build
          # jobs; only THIS deploy step needs it, and it fails fast with a clear message. Never echo the value.
          if [ -z "${ARGOCD_AUTH_TOKEN:-}" ]; then
            echo "::error title=ARGO_API_KEY missing::The org secret ARGO_API_KEY is not available to this repository (add the repo to the secret's selected repositories, and pass it from the caller or use 'secrets: inherit')."
            exit 1
          fi

          deploy_flavor() {
            FLAVOR="$1"
            # Map flavor to Docker target image.
            # CEL-609: if the flavor name is itself one of docker_targets (e.g.
            # `elabel`), deploy that target's image directly. This generalizes the
            # previous "first non-worker target" default, which assumed exactly one
            # non-worker target and would mis-route a 2nd app's flavor to the wrong
            # image. Backward-compatible: flavors that don't match a target name
            # (admin, public, worker-*) keep the legacy mapping below.
            if echo "$DOCKER_TARGETS" | jq -e --arg f "$FLAVOR" 'index($f) != null' >/dev/null; then
              IMAGE_NAME="${APP}-${FLAVOR}"
            else
              case "$FLAVOR" in
                ${WORKER_PREFIX}-*) IMAGE_NAME="${APP}-${WORKER_PREFIX}" ;;
                *)
                  # Use first non-worker target as the default image
                  FIRST_TARGET=$(echo "$DOCKER_TARGETS" | jq -r --arg w "$WORKER_PREFIX" '[.[] | select(. != $w)][0]')
                  IMAGE_NAME="${APP}-${FIRST_TARGET}"
                  ;;
              esac
            fi

            argocd app create --upsert ${APP}-${FLAVOR} --server $ARGOCD_URL \
              --project ${ARGOCD_PROJECT} \
              --repo git@github.com:CellarNode/crossplane-gcloud.git \
              --path ${DEPLOY_PATH}/${APP}-${FLAVOR}/ \
              --dest-server https://kubernetes.default.svc \
              --dest-namespace ${APP}-${FLAVOR} \
              --kustomize-image "app-image=${REGISTRY}/${IMAGE_NAME}:${TAG}" \
              --kustomize-common-label app.kubernetes.io/name=${APP}-${FLAVOR} \
              --nameprefix=${FLAVOR}- \
              --sync-policy auto \
              --sync-option CreateNamespace=true \
              --sync-option PruneLast=true
          }

          # Non-worker flavors first (input order), then `${WORKER_PREFIX}-*` flavors (input order).
          ORDERED=$(echo "$FLAVORS" | jq -r --arg w "$WORKER_PREFIX" '([.[] | select(startswith($w + "-") | not)] + [.[] | select(startswith($w + "-"))])[]')

          # No `set -e` here: each flavor runs in its own `set -e` subshell so a failure is recorded and the loop stops
          # (a `set -e` function called from an `if` would silently ignore failing commands inside it).
          set +e
          for F in $ORDERED; do
            echo "::group::Deploy ${APP}-${F}"
            ( set -eo pipefail; deploy_flavor "$F" )
            RC=$?
            echo "::endgroup::"
            if [ "$RC" -ne 0 ]; then
              echo "::error title=ArgoCD deploy failed::${APP}-${F} failed (exit ${RC}); flavors after it were not upserted."
              exit 1
            fi
          done

  deploy-skipped-notice:
    # CEL-2322: say clearly why a non-main dispatch did not deploy. Future preview path (not built yet): a SEPARATE
    # preview/staging ArgoCD project and namespace that deploys `branch-*` tags; this production workflow must never
    # grow a non-main deploy. Add an explicit opt-in input and a distinct app name/project for it when that exists.
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    steps:
      - name: Production deploys only from main
        env:
          REF_NAME: ${{ github.ref_name }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          echo "::notice title=Deploy skipped::Production deploys only from main. Built and pushed ${IMAGE_TAG} from ${REF_NAME}; it is NOT deployed. A future preview/staging environment can deploy branch-* tags."
          {
            echo "### Deploy skipped"
            echo "Production deploys only from \`main\`. This run built and pushed \`${IMAGE_TAG}\` from \`${REF_NAME}\` (kept for a future preview/staging environment) and did **not** deploy it."
          } >> "$GITHUB_STEP_SUMMARY"

  # --- Discord thread lifecycle ---

  discord-thread-open:
    # CEL-2546: also on ready_for_review (draft PRs build nothing, so a draft-first PR never reached `opened`); thread_open is idempotent.
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'ready_for_review')
    # CEL-2546: two overlapping runs for one PR (opened + ready_for_review, a re-run) must not both create a thread. They queue instead
    # (cancel-in-progress: false, a started thread-open is never killed mid-create), and the second sees the first's metadata comment.
    concurrency:
      group: discord-thread-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_open
      tags: ${{ inputs.discord_tags }}

  discord-build-update:
    needs: [build, build-fork, discord-thread-open]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      needs.build.result != 'cancelled' &&
      needs['build-fork'].result != 'cancelled'
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_update
      # same-repo PRs run `build`; fork PRs run `build-fork` — report whichever ran
      status: ${{ needs.build.result != 'skipped' && needs.build.result || needs['build-fork'].result }}

  discord-thread-close:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_close
      status: ${{ github.event.pull_request.merged && 'merged' || 'closed' }}

  discord-deploy:
    # With argocd_deploy=false the `deploy` job is skipped by design, so report the BUILD result (the image is pushed and
    # the cluster pulls it) instead of a misleading "skipped" warning.
    needs: [build, deploy]
    # CEL-2795: !cancelled(), not always(): a cancelled run must not wait for a runner just to post a notification (it would keep the run, and any concurrency group it is in, alive). Failures still notify.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: deploy
      status: ${{ needs.build.result != 'success' && needs.build.result || (inputs.argocd_deploy && needs.deploy.result || needs.build.result) }}
      deploy_mode: ${{ inputs.argocd_deploy && 'deployed' || 'published' }}
      image_tag: ${{ needs.build.outputs.image_tag }}
      tags: ${{ inputs.discord_tags }}
