name: Deploy Static Website

on:
  workflow_call:
    inputs:
      website:
        description: "Production hostname (e.g. admin.cellarnode.com)"
        required: true
        type: string
      website_slug:
        description: "Slug for preview URLs (e.g. admin-cellarnode-com)"
        required: true
        type: string
      build_env:
        description: "Build-time env vars as KEY=VALUE lines"
        required: false
        type: string
        default: ""
      typecheck:
        description: "Run pnpm tsc --noEmit before build"
        required: false
        type: boolean
        default: false
      lint:
        description: "Run pnpm lint before build"
        required: false
        type: boolean
        default: false
      frozen_lockfile:
        description: "Use --frozen-lockfile for pnpm install"
        required: false
        type: boolean
        default: true
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      pnpm_version:
        description: "Trusted pnpm version used for preview builds"
        required: false
        type: string
        default: "10.32.1"
      discord_tags:
        description: "Comma-separated Discord forum tag names (e.g. admin,importer)"
        required: false
        type: string
        default: ""
    secrets:
      NPM_TOKEN:
        description: "Read-only npm token used to fetch private @cellarnode packages"
        required: true
      DISCORD_WEBHOOK_URL:
        description: "Discord webhook credential"
        required: false

env:
  PROJECT_ID: festive-terrain-478011-h0
  GCS_BUCKET: websites-deploy

jobs:
  # pull_request_target loads this workflow from the base branch. The PR can
  # change source and lockfiles, but it cannot add a step that reads NPM_TOKEN.
  # This job only populates a pnpm store; it never executes project or package
  # lifecycle code. The store crosses into the tokenless build through an
  # artifact and the GitHub-hosted runners are isolated per job.
  preview-dependencies:
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout pull-request dependency lock
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: ${{ inputs.pnpm_version }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node_version }}

      - name: Reject executable dependency sources
        shell: bash
        run: |
          if grep -En '(git\+|github:|gitlab:|bitbucket:|https?://|file:|link:)' pnpm-lock.yaml; then
            echo "Preview dependency lock contains a non-registry source" >&2
            exit 1
          fi

      - name: Fetch dependencies without lifecycle execution
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PNPM_STORE_PATH: ${{ runner.temp }}/pnpm-store
        run: |
          rm -f -- .npmrc .pnpmfile.cjs
          TRUSTED_HOME="${RUNNER_TEMP}/cellarnode-preview-home"
          trap 'rm -rf -- "$TRUSTED_HOME"' EXIT
          mkdir -p "$TRUSTED_HOME"
          umask 077
          printf '%s\n' \
            '@cellarnode:registry=https://registry.npmjs.org/' \
            "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" \
            > "$TRUSTED_HOME/.npmrc"
          HOME="$TRUSTED_HOME" pnpm fetch --frozen-lockfile --ignore-scripts --ignore-pnpmfile --store-dir "$PNPM_STORE_PATH"

      - name: Upload dependency store
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-dependencies-${{ inputs.website_slug }}
          path: ${{ runner.temp }}/pnpm-store
          if-no-files-found: error
          retention-days: 1

  build-preview:
    needs: preview-dependencies
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout pull-request source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: ${{ inputs.pnpm_version }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node_version }}

      - name: Download dependency store
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: preview-dependencies-${{ inputs.website_slug }}
          path: ${{ runner.temp }}/pnpm-store

      - name: Install dependencies offline
        shell: bash
        env:
          PNPM_STORE_PATH: ${{ runner.temp }}/pnpm-store
        run: |
          rm -f -- .npmrc .pnpmfile.cjs
          pnpm install --offline --frozen-lockfile --ignore-scripts --ignore-pnpmfile --store-dir "$PNPM_STORE_PATH"

      - name: Rebuild dependencies
        run: pnpm rebuild

      - name: Type check
        if: inputs.typecheck
        run: pnpm tsc --noEmit

      - name: Lint
        if: inputs.lint
        run: pnpm lint

      - name: Build preview
        shell: bash
        env:
          BUILD_ENV_VARS: ${{ inputs.build_env }}
        run: |
          if [ -n "$BUILD_ENV_VARS" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && export "${line?}"
            done <<< "$BUILD_ENV_VARS"
          fi
          pnpm build

      - name: Upload static site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-site-${{ inputs.website_slug }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  build-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted-k8s
    container:
      image: europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner@sha256:e57fadf58eb4e125a101f366a9cd97cb022e3cb8a9eae6028cefdfb0003b2960
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install dependencies
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm install ${{ inputs.frozen_lockfile && '--frozen-lockfile' || '--no-frozen-lockfile' }} --ignore-scripts

      - name: Rebuild dependencies
        run: pnpm rebuild

      - name: Type check
        if: inputs.typecheck
        run: pnpm tsc --noEmit

      - name: Lint
        if: inputs.lint
        run: pnpm lint

      - name: Build production
        shell: bash
        env:
          BUILD_ENV_VARS: ${{ inputs.build_env }}
        run: |
          if [ -n "$BUILD_ENV_VARS" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && export "${line?}"
            done <<< "$BUILD_ENV_VARS"
          fi
          pnpm build

      - name: Upload static site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-site-${{ inputs.website_slug }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    needs: build-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted-k8s
    container:
      image: europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner@sha256:e57fadf58eb4e125a101f366a9cd97cb022e3cb8a9eae6028cefdfb0003b2960
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: static-site-${{ inputs.website_slug }}
          path: dist

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: 'projects/1040576468442/locations/global/workloadIdentityPools/iamwipp-pipelines/providers/iamwipp-github-pipelines-beveriq'
          service_account: 'pipelines@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          skip_install: true

      - name: Warm gcloud credential cache
        run: |
          for i in 1 2 3 4 5; do
            gcloud storage ls "gs://${GCS_BUCKET}" > /dev/null && exit 0
            echo "gcloud warm-up attempt ${i}/5 failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "gcloud warm-up failed after 5 attempts" >&2
          exit 1

      - name: Deploy to production
        env:
          WEBSITE: ${{ inputs.website }}
        run: |
          gcloud storage rsync --recursive --checksums-only --delete-unmatched-destination-objects \
            ./dist "gs://${GCS_BUCKET}/${WEBSITE}"

  deploy-preview:
    needs: build-preview
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted-k8s
    container:
      image: europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner@sha256:e57fadf58eb4e125a101f366a9cd97cb022e3cb8a9eae6028cefdfb0003b2960
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: static-site-${{ inputs.website_slug }}
          path: dist

      - name: Reject non-regular artifact entries
        shell: bash
        run: |
          test -d dist
          if find dist \( -type l -o -type b -o -type c -o -type p -o -type s \) -print -quit | grep -q .; then
            echo "Static artifact contains a non-regular entry" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: 'projects/1040576468442/locations/global/workloadIdentityPools/iamwipp-pipelines/providers/iamwipp-github-pipelines-beveriq'
          service_account: 'pipelines@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          skip_install: true

      - name: Warm gcloud credential cache
        run: |
          for i in 1 2 3 4 5; do
            gcloud storage ls "gs://${GCS_BUCKET}" > /dev/null && exit 0
            echo "gcloud warm-up attempt ${i}/5 failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "gcloud warm-up failed after 5 attempts" >&2
          exit 1

      - name: Deploy preview
        env:
          WEBSITE_SLUG: ${{ inputs.website_slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gcloud storage rsync --recursive --checksums-only --delete-unmatched-destination-objects \
            ./dist "gs://${GCS_BUCKET}/preview/${WEBSITE_SLUG}/pr${PR_NUMBER}"

      - name: Comment preview URL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          WEBSITE_SLUG: ${{ inputs.website_slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const slug = process.env.WEBSITE_SLUG;
            const prNumber = Number(process.env.PR_NUMBER);
            const previewUrl = `https://${slug}-pr${prNumber}.dev.cellarnode.com`;
            const body = `## Preview Deployment\n\nPreview available at: ${previewUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('Preview Deployment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: self-hosted-k8s
    container:
      image: europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner@sha256:e57fadf58eb4e125a101f366a9cd97cb022e3cb8a9eae6028cefdfb0003b2960
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: 'projects/1040576468442/locations/global/workloadIdentityPools/iamwipp-pipelines/providers/iamwipp-github-pipelines-beveriq'
          service_account: 'pipelines@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          skip_install: true

      - name: Delete preview
        env:
          WEBSITE_SLUG: ${{ inputs.website_slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gcloud storage rm --recursive "gs://${GCS_BUCKET}/preview/${WEBSITE_SLUG}/pr${PR_NUMBER}" || true

  discord-thread-open:
    if: github.event_name == 'pull_request_target' && github.event.action == 'opened'
    permissions:
      pull-requests: write
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_open
      tags: ${{ inputs.discord_tags }}

  discord-build-update:
    needs: [preview-dependencies, build-preview, deploy-preview, discord-thread-open]
    if: >-
      always() &&
      github.event_name == 'pull_request_target' &&
      github.event.action != 'closed' &&
      needs.preview-dependencies.result != 'cancelled'
    permissions:
      pull-requests: write
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_update
      status: ${{ needs.preview-dependencies.result == 'success' && (needs.build-preview.result == 'success' && (needs.deploy-preview.result == 'skipped' && 'success' || needs.deploy-preview.result) || needs.build-preview.result) || needs.preview-dependencies.result }}
      preview_url: ${{ needs.deploy-preview.result == 'success' && format('https://{0}-pr{1}.dev.cellarnode.com', inputs.website_slug, github.event.pull_request.number) || '' }}

  discord-thread-close:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    permissions:
      pull-requests: write
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_close
      status: ${{ github.event.pull_request.merged && 'merged' || 'closed' }}

  discord-deploy:
    needs: [build-production, deploy-production]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: deploy
      status: ${{ needs.build-production.result == 'success' && needs.deploy-production.result || needs.build-production.result }}
      tags: ${{ inputs.discord_tags }}
