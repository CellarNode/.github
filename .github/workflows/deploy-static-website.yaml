name: Deploy Static Website

on:
  workflow_call:
    inputs:
      website:
        description: "Production hostname (e.g. admin.cellarnode.com)"
        required: true
        type: string
      website_slug:
        description: "Slug for preview URLs (e.g. admin-cellarnode-com)"
        required: true
        type: string
      build_env:
        description: "Build-time env vars as KEY=VALUE lines"
        required: false
        type: string
        default: ""
      typecheck:
        description: "Run pnpm tsc --noEmit before build"
        required: false
        type: boolean
        default: false
      lint:
        description: "Run pnpm lint before build"
        required: false
        type: boolean
        default: false
      frozen_lockfile:
        description: "Use --frozen-lockfile for pnpm install"
        required: false
        type: boolean
        default: true
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      pnpm_version:
        description: "Trusted pnpm version used for preview builds"
        required: false
        type: string
        default: "10.32.1"
      discord_tags:
        description: "Comma-separated Discord forum tag names (e.g. admin,importer)"
        required: false
        type: string
        default: ""
      deploy_service_account:
        description: "Per-site production deploy service account (<name>@festive-terrain-478011-h0.iam.gserviceaccount.com); never the shared pipelines account"
        required: true
        type: string
    secrets:
      DISCORD_WEBHOOK_URL:
        description: "Discord webhook credential"
        required: false

concurrency:
  group: static-deploy-${{ inputs.website_slug }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  PROJECT_ID: festive-terrain-478011-h0
  GCS_BUCKET: websites-deploy

jobs:
  preview-policy:
    # Metadata-only job: it never checks out or runs pull-request code. Only
    # private repositories use the cluster pool, and fork pull_request_target
    # events stay on GitHub-hosted so outside contributors cannot consume the
    # small runner pool.
    runs-on: >-
      ${{ github.event.repository.private == true &&
          (github.event_name == 'push' ||
           (github.event_name == 'pull_request_target' &&
            github.event.pull_request.head.repo.full_name == github.repository)) &&
          'self-hosted-k8s' || 'ubuntu-latest' }}
    container: >-
      ${{ github.event.repository.private == true &&
          (github.event_name == 'push' ||
           (github.event_name == 'pull_request_target' &&
            github.event.pull_request.head.repo.full_name == github.repository)) &&
          'europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner@sha256:b8ae250c5d7fae79dbbea1f62ca7613ecabd6f3efbd13b533cbdecb293cdf814'
          || '' }}
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.policy.outputs.trusted }}
      toolchain_allowed: ${{ steps.policy.outputs.toolchain_allowed }}
    steps:
      - name: Evaluate preview trust boundary
        id: policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          NODE_VERSION: ${{ inputs.node_version }}
          PNPM_VERSION: ${{ inputs.pnpm_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          same_repository=false
          if [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            same_repository=true
          fi

          actor_matches_author=false
          if [ "$ACTOR" = "$AUTHOR" ]; then
            actor_matches_author=true
          fi

          toolchain_allowed=false
          if [ "$NODE_VERSION" = "22" ]; then
            case "$PNPM_VERSION" in
              10.28.2|10.32.1) toolchain_allowed=true ;;
            esac
          fi

          permission_allowed=false
          if [ "$EVENT_NAME" = "pull_request_target" ] &&
            [ "$same_repository" = "true" ] &&
            [ "$actor_matches_author" = "true" ]; then
            # The ARC runner image has curl and jq but no gh CLI. The token goes to
            # curl on stdin (printf is a builtin) so it never appears in argv. With
            # pipefail a lookup that still fails after the retries aborts the
            # step, so the policy fails closed.
            permission="$(printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" |
              curl --config - --fail --silent --show-error --globoff \
                --max-time 30 --retry 2 \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/collaborators/${ACTOR}/permission" |
              jq -r .permission)"
            case "$permission" in
              admin|maintain|write) permission_allowed=true ;;
            esac
          fi

          trusted=false
          if [ "$EVENT_NAME" = "pull_request_target" ] &&
            [ "$EVENT_ACTION" != "closed" ] &&
            [ "$same_repository" = "true" ] &&
            [ "$permission_allowed" = "true" ] &&
            [ "$actor_matches_author" = "true" ] &&
            [ "$toolchain_allowed" = "true" ]; then
            trusted=true
          fi

          printf 'trusted=%s\n' "$trusted" >> "$GITHUB_OUTPUT"
          printf 'toolchain_allowed=%s\n' "$toolchain_allowed" >> "$GITHUB_OUTPUT"
          printf 'preview policy: event=%s action=%s same_repository=%s permission_allowed=%s actor_matches_author=%s toolchain_allowed=%s trusted=%s\n' \
            "$EVENT_NAME" "$EVENT_ACTION" "$same_repository" "$permission_allowed" "$actor_matches_author" "$toolchain_allowed" "$trusted"

  build-preview:
    needs: preview-policy
    if: needs.preview-policy.outputs.trusted == 'true'
    # CEL-2768: previews stay GitHub-hosted and are not needed while the hosted
    # budget is exhausted. Do not move this job to the cluster pool: it runs
    # unmerged pull-request lifecycle scripts, and every pool pod carries the
    # buildkitd client certificate.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: ${{ inputs.pnpm_version }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node_version }}

      - name: Checkout pull-request source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Validate preview dependency inputs
        shell: bash
        env:
          MANIFEST_VALIDATOR: ${{ runner.temp }}/cellarnode-preview-manifest-validator.rb
          LOCK_VALIDATOR: ${{ runner.temp }}/cellarnode-preview-lock-validator.rb
        run: &dependency-validation |
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          cat > "$MANIFEST_VALIDATOR" <<'RUBY'
          require "find"
          require "json"
          require "yaml"

          private_package = /@cellarnode\/([a-z0-9._-]+)/i
          dependency_sections = %w[
            catalog
            catalogs
            configDependencies
            dependencies
            devDependencies
            optionalDependencies
            overrides
            packageExtensions
            patchedDependencies
            peerDependencies
            resolutions
          ].freeze
          direct_dependency_sections = %w[
            dependencies
            devDependencies
            optionalDependencies
            peerDependencies
          ].freeze
          protocol_dependency_source = /\A[a-z][a-z0-9+.-]*:/i
          path_or_archive_dependency_source = /[\\\/]|\.(?:tgz|tar(?:\.gz)?)\z/i
          canonical_private_packages = %w[
            agent-cards
            auth
            beverage-utils
            elabel-compliance
            finance
            i18n
            ui
          ].freeze
          frozen_registry_aliases = {
            "@cellarnode/ui-renderer-0-154" => "npm:@cellarnode/ui@0.154.0",
            "@cellarnode/ui-renderer-0-155" => "npm:@cellarnode/ui@0.155.1",
          }.freeze
          # A version-pinned npm: alias is registry-sourced, but only aliases
          # that TARGET an allowed @cellarnode package are exempt from the
          # protocol check (e.g. @cellarnode/ui-renderer-0-154 ->
          # npm:@cellarnode/ui@0.154.0, the frozen e-label public renderer,
          # CEL-1522). An npm: alias pointing anywhere else still fails.
          allowed_registry_alias = /\Anpm:@cellarnode\/(?:#{Regexp.union(canonical_private_packages).source})@[^\s\/\\]+\z/
          failures = []
          manifests = []
          Find.find(".") do |path|
            if File.directory?(path)
              Find.prune if %w[./.git ./node_modules].include?(path)
              next
            end
            next unless File.basename(path) == "package.json"

            abort "Dependency manifest must be a regular file: #{path}" if File.symlink?(path) || !File.file?(path)
            manifests << path
          end
          abort "Root package.json must be a regular file" unless manifests.include?("./package.json")

          visit = lambda do |value, path, keys|
            case value
            when Hash
              value.each do |key, child|
                child_keys = keys + [key.to_s]
                key.to_s.scan(private_package).flatten.each do |package|
                  alias_name = "@cellarnode/#{package.downcase}"
                  allowed_frozen_alias_key = frozen_registry_aliases.key?(alias_name) &&
                    child_keys.length == 2 &&
                    direct_dependency_sections.include?(child_keys.first) &&
                    child_keys.last == alias_name
                  failures << "#{path}:#{child_keys.join('.')}" unless canonical_private_packages.include?(package.downcase) || allowed_frozen_alias_key
                end
                expected_alias = frozen_registry_aliases[key.to_s]
                failures << "#{path}:#{child_keys.join('.')}" if expected_alias && child != expected_alias
                visit.call(child, path, child_keys)
              end
            when Array
              value.each_with_index { |child, index| visit.call(child, path, keys + [index.to_s]) }
            when String
              value.scan(private_package).flatten.each do |package|
                failures << "#{path}:#{keys.join('.')}" unless canonical_private_packages.include?(package.downcase)
              end
              # An allowed registry alias is exempt from BOTH source checks: its
              # scope slash would otherwise trip the path heuristic.
              if keys.any? { |key| dependency_sections.include?(key) } &&
                 !allowed_registry_alias.match?(value) &&
                 (protocol_dependency_source.match?(value) ||
                  path_or_archive_dependency_source.match?(value))
                failures << "#{path}:#{keys.join('.')}"
              end
            end
          end

          manifests.each { |path| visit.call(JSON.parse(File.read(path)), path, []) }
          workspace_path = "./pnpm-workspace.yaml"
          if File.exist?(workspace_path)
            abort "pnpm-workspace.yaml must be a regular file" if File.symlink?(workspace_path) || !File.file?(workspace_path)
            workspace = YAML.safe_load(File.read(workspace_path), aliases: true)
            abort "pnpm-workspace.yaml must contain a mapping" unless workspace.is_a?(Hash)
            workspace.each_key do |key|
              name = key.to_s
              if %w[namedRegistries registries registry].include?(name) || name.end_with?(":registry")
                failures << "#{workspace_path}:#{name}"
              end
            end
            visit.call(workspace, workspace_path, [])
          end
          abort "Dependency manifest contains a disallowed package or source at #{failures.uniq.join(', ')}" unless failures.empty?
          RUBY

          cat > "$LOCK_VALIDATOR" <<'RUBY'
          require "yaml"

          path = ARGV.fetch(0)
          non_registry_protocol = /(?:\A|@)(?!npm:)[a-z][a-z0-9+.-]*:/i
          relative_archive_source = /\A(?:\.\.?[\\\/]|~[\\\/]|[\\\/])|\.(?:tgz|tar(?:\.gz)?)\z/i
          repository_shorthand = /\A[a-z0-9._-]+(?:[\\\/][a-z0-9._-]+)+(?:#.*)?\z/i
          private_package = /@cellarnode\/([a-z0-9._-]+)/i
          dependency_sections = %w[dependencies devDependencies optionalDependencies peerDependencies].freeze
          canonical_private_packages = %w[
            agent-cards
            auth
            beverage-utils
            elabel-compliance
            finance
            i18n
            ui
          ].freeze
          peer_locator = /\G(?:@[a-z0-9._-]+\/[a-z0-9._-]+|[a-z0-9._-]+)@[0-9a-z][0-9a-z.+_-]*/
          parse_peer_group = nil
          parse_peer_group = lambda do |text, index|
            next nil unless text[index] == "("

            index += 1
            locator = peer_locator.match(text, index)
            next nil unless locator

            index = locator.end(0)
            valid = true
            while valid && text[index] == "("
              nested_end = parse_peer_group.call(text, index)
              if nested_end
                index = nested_end
              else
                valid = false
              end
            end
            next nil unless valid
            next nil unless text[index] == ")"

            index + 1
          end
          valid_peer_suffix = lambda do |suffix|
            next true if suffix.empty?
            next true if suffix.match?(/\A\([a-f0-9]{32}\)\z/)

            index = 0
            valid = true
            while valid && index < suffix.length
              group_end = parse_peer_group.call(suffix, index)
              if group_end
                index = group_end
              else
                valid = false
              end
            end
            valid && index.positive?
          end
          frozen_registry_aliases = {
            "@cellarnode/ui-renderer-0-154" => {
              "specifier" => "npm:@cellarnode/ui@0.154.0",
              "version" => "@cellarnode/ui@0.154.0",
            }.freeze,
            "@cellarnode/ui-renderer-0-155" => {
              "specifier" => "npm:@cellarnode/ui@0.155.1",
              "version" => "@cellarnode/ui@0.155.1",
            }.freeze,
          }.freeze
          failures = []
          validate_private_packages = lambda do |text, keys|
            text.to_s.scan(private_package).flatten.each do |package|
              alias_name = "@cellarnode/#{package.downcase}"
              allowed_frozen_alias_key = frozen_registry_aliases.key?(alias_name) &&
                keys.length == 4 &&
                keys[0] == "importers" &&
                dependency_sections.include?(keys[2]) &&
                keys[3] == alias_name
              failures << keys.join(".") unless canonical_private_packages.include?(package.downcase) || allowed_frozen_alias_key
            end
          end
          visit = lambda do |value, keys|
            case value
            when Hash
              value.each do |key, child|
                name = key.to_s
                child_keys = keys + [name]
                validate_private_packages.call(name, child_keys)
                expected_alias = frozen_registry_aliases[name]
                if expected_alias
                  resolved_version = child["version"] if child.is_a?(Hash)
                  expected_version = expected_alias.fetch("version")
                  valid_version = resolved_version.is_a?(String) &&
                    resolved_version.start_with?(expected_version) &&
                    valid_peer_suffix.call(resolved_version.delete_prefix(expected_version))
                  valid_alias = keys.length == 3 &&
                    keys[0] == "importers" &&
                    dependency_sections.include?(keys[2]) &&
                    child.is_a?(Hash) &&
                    child["specifier"] == expected_alias.fetch("specifier") &&
                    valid_version
                  failures << child_keys.join(".") unless valid_alias
                end
                if name == "resolution"
                  valid_resolution = child.is_a?(Hash) &&
                    child.keys.map(&:to_s) == ["integrity"] &&
                    child["integrity"].is_a?(String) &&
                    child["integrity"].match?(/\Asha(?:1|256|384|512)-[A-Za-z0-9+\/]+={0,2}\z/)
                  failures << child_keys.join(".") unless valid_resolution
                end
                if non_registry_protocol.match?(name) || relative_archive_source.match?(name)
                  failures << child_keys.join(".")
                end
                if keys.last == "resolution" && name != "integrity"
                  failures << child_keys.join(".")
                end
                visit.call(child, child_keys)
              end
            when Array
              value.each_with_index { |child, index| visit.call(child, keys + [index.to_s]) }
            when String
              validate_private_packages.call(value, keys)
              if non_registry_protocol.match?(value) ||
                 relative_archive_source.match?(value) ||
                 (keys.any? { |key| dependency_sections.include?(key) } && repository_shorthand.match?(value))
                failures << keys.join(".")
              end
            end
          end

          lock = YAML.safe_load(File.read(path), aliases: true)
          abort "Dependency lock must contain a mapping" unless lock.is_a?(Hash)
          abort "Dependency lock must use lockfile version 9.0" unless lock["lockfileVersion"].to_s == "9.0"
          abort "Dependency lock importers must contain a mapping" unless lock["importers"].is_a?(Hash)
          %w[packages snapshots].each do |section|
            abort "Dependency lock #{section} must contain a mapping" if lock.key?(section) && !lock[section].is_a?(Hash)
          end

          visit.call(lock, [])
          abort "Dependency lock contains a disallowed source or private package at #{failures.uniq.join(', ')}" unless failures.empty?
          RUBY

          ruby "$MANIFEST_VALIDATOR"
          if [ ! -f pnpm-lock.yaml ] || [ -L pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml must be a regular file" >&2
            exit 1
          fi
          ruby "$LOCK_VALIDATOR" pnpm-lock.yaml

      - name: Revalidate preview authorization
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          ACTOR: ${{ github.actor }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        with:
          github-token: ${{ github.token }}
          script: &preview-authorization |
            const actor = process.env.ACTOR;
            const expectedHead = process.env.EXPECTED_HEAD;
            const prNumber = Number(process.env.PR_NUMBER);
            const repository = process.env.REPOSITORY;
            const { data: pullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            });
            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: actor,
            });
            const authorized = pullRequest.state === 'open' &&
              pullRequest.user?.login === actor &&
              pullRequest.head.repo?.full_name === repository &&
              pullRequest.head.sha === expectedHead &&
              ['admin', 'maintain', 'write'].includes(access.permission);
            if (!authorized) {
              core.setFailed('Preview authorization is no longer valid');
            }

      - name: Install dependencies
        shell: bash
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/cellarnode-preview-npmrc
          MANIFEST_VALIDATOR: ${{ runner.temp }}/cellarnode-preview-manifest-validator.rb
          LOCK_VALIDATOR: ${{ runner.temp }}/cellarnode-preview-lock-validator.rb
        run: |
          rm -f -- .npmrc .pnpmfile.cjs "$NPM_CONFIG_USERCONFIG"
          trap 'rm -f "$NPM_CONFIG_USERCONFIG" "$MANIFEST_VALIDATOR" "$LOCK_VALIDATOR"' EXIT
          umask 077
          printf '%s\n' \
            '@cellarnode:registry=https://registry.npmjs.org/' \
            > "$NPM_CONFIG_USERCONFIG"
          pnpm install ${{ inputs.frozen_lockfile && '--frozen-lockfile' || '--no-frozen-lockfile' }} --ignore-scripts --ignore-pnpmfile
          ruby "$LOCK_VALIDATOR" pnpm-lock.yaml

      - name: Verify credential isolation
        env:
          NPM_TOKEN: ""
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/cellarnode-preview-npmrc
        run: |
          test -z "$NPM_TOKEN"
          test ! -e "$NPM_CONFIG_USERCONFIG"
          test ! -e .npmrc
          test ! -e .pnpmfile.cjs

      - name: Rebuild dependencies
        env:
          NPM_TOKEN: ""
        run: pnpm rebuild

      - name: Type check
        if: inputs.typecheck
        env:
          NPM_TOKEN: ""
        run: pnpm tsc --noEmit

      - name: Lint
        if: inputs.lint
        env:
          NPM_TOKEN: ""
        run: pnpm lint

      - name: Build preview
        shell: bash
        env:
          BUILD_ENV_VARS: ${{ inputs.build_env }}
          NPM_TOKEN: ""
        run: |
          if [ -n "$BUILD_ENV_VARS" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && export "${line?}"
            done <<< "$BUILD_ENV_VARS"
          fi
          pnpm build

      - name: Reject non-regular build outputs
        shell: bash
        run: |
          test -d dist
          bad=$(find dist \( -type l -o -type b -o -type c -o -type p -o -type s \) -print -quit) || exit 1
          if [ -n "$bad" ]; then
            echo "Static artifact contains a non-regular entry" >&2
            exit 1
          fi

      - name: Upload static site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-site-${{ inputs.website_slug }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  # CEL-2768: build and deploy happen in ONE job so no artifact (or cache) hand-off is needed.
  # Artifact storage is exhausted, and a cache hand-off lets a compromised build overwrite action
  # code in a credentialed job (actions/cache restore extracts with tar -P; CellarNode/.github#42).
  #
  # SECURITY MODEL: the IAM bindings are the only boundary. Build and dependency code runs in the
  # same job as id-token: write, so it can request an OIDC token itself. What limits the damage is
  # the per-site deploy service account (caller input deploy_service_account), which can write only
  # its own gs://websites-deploy/<hostname>/ prefix, together with the pipelines exclusion in
  # crossplane-gcloud#160: nothing that can produce this job's token may impersonate pipelines.
  # Neither binding is enforced in this file. Everything else here is defence in depth: building
  # before authenticating, the `unset` lines, --ignore-scripts, and the dist re-check. Pinning an
  # action by SHA does not protect its code on disk from other code running in the same job. Not
  # covered here: job pods on the pool carry the shared buildkitd client certificate, so build code
  # in this job can reach that daemon. That exposure predates this change and is tracked in
  # CEL-2798.
  deploy-production:
    needs: preview-policy
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.preview-policy.outputs.toolchain_allowed == 'true'
    runs-on: self-hosted-k8s
    # The production lock is on this job, not the workflow: a push run's workflow group is unique per run (run_id), so the notification job
    # below never holds a lock that the next deploy of the same site would have to wait for. cancel-in-progress: false only protects the RUNNING
    # deploy. GitHub keeps at most ONE pending job per concurrency group and cancels an older pending job when a newer one queues, and ARC does
    # not start jobs in FIFO order, so an older run A can become pending after a newer run B and cancel B. The .deploy/sha marker stops the site
    # going backwards, but it cannot guarantee that the newest commit deploys. The check-newer-head job and the Discord notice report that
    # case (they run no build code, so this job never needs a GitHub token), and the fix is to re-run the production run of the newest main commit.
    concurrency:
      group: static-deploy-prod-${{ inputs.website_slug }}
      cancel-in-progress: false
    outputs:
      # 'true' only when the rsync and the final marker write both succeeded. 'false' for a stale skip. Empty when the step failed or never ran.
      deployed: ${{ steps.deploy.outputs.deployed }}
    container:
      image: europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner@sha256:b8ae250c5d7fae79dbbea1f62ca7613ecabd6f3efbd13b533cbdecb293cdf814
    permissions:
      contents: read
      id-token: write

    # Defence in depth, not a boundary (the IAM bindings are, see above). Every `run:` script starts with
    # `unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN`, so code those steps run cannot casually mint this job's OIDC
    # token from its own environment. A step-level `env:` blank would NOT work: the runner sets both variables after it applies the step
    # env (actions/runner ScriptHandler / NodeScriptActionHandler / ContainerActionHandler). `uses:` steps cannot be stripped this way, and
    # pinning them does not protect action code on disk from other code in the same job. Code could also read the values from its parent
    # shell's /proc/<pid>/environ, or request a token another way. Build-before-auth ordering and the `dist` re-check right before the
    # upload narrow the window; they do not close it.
    steps:
      - name: Validate deploy service account
        shell: bash
        env:
          DEPLOY_SERVICE_ACCOUNT: ${{ inputs.deploy_service_account }}
          WEBSITE: ${{ inputs.website }}
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          set -euo pipefail
          # Every production gcloud command is confined to gs://websites-deploy/<hostname>/, which is
          # also the only prefix the per-site account can touch, so the hostname must be a plain
          # DNS name: no empty value, slash, dot-segment or glob that could widen the target.
          if [[ ! "$WEBSITE" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?([.][a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]]; then
            echo "website must be a lowercase DNS hostname, got: ${WEBSITE}" >&2
            exit 1
          fi
          # Fail closed before any source is fetched: the account must be a per-site identity in
          # this project, and production must never fall back to the shared pipelines identity.
          pattern='^site-deploy-[a-z0-9-]+@'"${PROJECT_ID}"'[.]iam[.]gserviceaccount[.]com$'
          if [[ ! "$DEPLOY_SERVICE_ACCOUNT" =~ $pattern ]]; then
            echo "deploy_service_account must be a site-deploy-<name>@${PROJECT_ID}.iam.gserviceaccount.com service account" >&2
            exit 1
          fi
          if [ "${DEPLOY_SERVICE_ACCOUNT%%@*}" = "pipelines" ]; then
            echo "deploy_service_account must be a per-site identity, never the shared pipelines account" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: ${{ inputs.pnpm_version }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node_version }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Full commit history: the stale-deploy guard in "Deploy to production" needs the merge-base of this commit and the live one.
          # filter: blob:none omits file contents for older commits, which the guard never reads, so the cost stays small.
          fetch-depth: 0
          filter: blob:none

      - name: Validate production dependency inputs
        shell: bash
        env:
          MANIFEST_VALIDATOR: ${{ runner.temp }}/cellarnode-production-manifest-validator.rb
          LOCK_VALIDATOR: ${{ runner.temp }}/cellarnode-production-lock-validator.rb
        run: *dependency-validation

      - name: Install dependencies
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/cellarnode-production-npmrc
          MANIFEST_VALIDATOR: ${{ runner.temp }}/cellarnode-production-manifest-validator.rb
          LOCK_VALIDATOR: ${{ runner.temp }}/cellarnode-production-lock-validator.rb
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          rm -f -- .npmrc .pnpmfile.cjs "$NPM_CONFIG_USERCONFIG"
          trap 'rm -f "$NPM_CONFIG_USERCONFIG" "$MANIFEST_VALIDATOR" "$LOCK_VALIDATOR"' EXIT
          umask 077
          printf '%s\n' \
            '@cellarnode:registry=https://registry.npmjs.org/' \
            > "$NPM_CONFIG_USERCONFIG"
          pnpm install ${{ inputs.frozen_lockfile && '--frozen-lockfile' || '--no-frozen-lockfile' }} --ignore-scripts --ignore-pnpmfile
          ruby "$LOCK_VALIDATOR" pnpm-lock.yaml

      - name: Verify credential isolation
        env:
          NPM_TOKEN: ""
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/cellarnode-production-npmrc
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          test -z "$NPM_TOKEN"
          test ! -e "$NPM_CONFIG_USERCONFIG"
          test ! -e .npmrc
          test ! -e .pnpmfile.cjs

      # No `pnpm rebuild` here: it would run dependency lifecycle scripts again, undoing --ignore-scripts, in the job that holds
      # `id-token: write`. pnpm 10 runs a dependency's script only when it is allowlisted (`onlyBuiltDependencies`); measured with
      # `pnpm rebuild --reporter=ndjson`, it runs nothing for admin-v2, e-label and importer, and only @swc/core and esbuild for producer,
      # whose build works without it. The hosted `build-preview` keeps its rebuild: it holds no id-token.

      - name: Type check
        if: inputs.typecheck
        env:
          NPM_TOKEN: ""
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          pnpm tsc --noEmit

      - name: Lint
        if: inputs.lint
        env:
          NPM_TOKEN: ""
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          pnpm lint

      - name: Build production
        shell: bash
        env:
          BUILD_ENV_VARS: ${{ inputs.build_env }}
          NPM_TOKEN: ""
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          if [ -n "$BUILD_ENV_VARS" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && export "${line?}"
            done <<< "$BUILD_ENV_VARS"
          fi
          pnpm build

      - name: Reject non-regular build outputs
        shell: bash
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          test -d dist
          bad=$(find dist \( -type l -o -type b -o -type c -o -type p -o -type s \) -print -quit) || exit 1
          if [ -n "$bad" ]; then
            echo "Static artifact contains a non-regular entry" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: 'projects/1040576468442/locations/global/workloadIdentityPools/iamwipp-pipelines/providers/iamwipp-github-pipelines-beveriq'
          service_account: ${{ inputs.deploy_service_account }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        env:
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud
        with:
          skip_install: true

      - name: Warm gcloud credential cache
        env:
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud
          WEBSITE: ${{ inputs.website }}
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          # List only this site's prefix: the per-site account cannot list the bucket root. A first
          # deploy has no objects yet, and "matched no objects" still proves the credentials work.
          for i in 1 2 3 4 5; do
            if out="$(gcloud storage ls "gs://${GCS_BUCKET}/${WEBSITE}/" 2>&1 > /dev/null)"; then
              exit 0
            fi
            case "$out" in
              *"matched no objects"*) exit 0 ;;
            esac
            echo "gcloud warm-up attempt ${i}/5 failed: ${out}; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "gcloud warm-up failed after 5 attempts" >&2
          exit 1

      - name: Deploy to production
        id: deploy
        env:
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud
          CLOUDSDK_STORAGE_PROCESS_COUNT: '1'
          CLOUDSDK_STORAGE_THREAD_COUNT: '1'
          # Composite uploads (default for files of 150 MiB or more) stage temporary component objects
          # outside the site prefix and need storage.buckets.get, neither of which the per-site account has.
          CLOUDSDK_STORAGE_PARALLEL_COMPOSITE_UPLOAD_ENABLED: 'False'
          WEBSITE: ${{ inputs.website }}
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          # Re-run the build-output check right before uploading: a process left running by the
          # build could have recreated a symlink or special file since the earlier check.
          test -d dist
          bad=$(find dist \( -type l -o -type b -o -type c -o -type p -o -type s \) -print -quit) || exit 1
          if [ -n "$bad" ]; then
            echo "Static artifact contains a non-regular entry" >&2
            exit 1
          fi
          # Stale-deploy guard. The workflow group is unique per push run, so two runs can reach the production lock out of order. The
          # site records the commit it is deploying (or last deployed) in .deploy/sha. A run whose commit is a strict ANCESTOR of the
          # recorded one is stale and skips; a missing marker, an equal sha (redeploy), a descendant or diverged history all deploy. This
          # never skips a change that no newer run deployed. If the marker is malformed, names a commit this checkout does not have, or
          # cannot be read for any other reason, the step fails closed. The checkout is fetch-depth: 0 for the ancestry check.
          marker="gs://${GCS_BUCKET}/${WEBSITE}/.deploy/sha"
          recovery="Operator recovery: gcloud storage rm ${marker} (see the runbook section 'Deploy marker' in ci-identities.md)"
          err=$(mktemp)
          if last=$(gcloud storage cat "$marker" 2>"$err"); then
            last=$(printf '%s' "$last" | tr -d '[:space:]')
            case "$last" in
              "" | *[!0-9a-f]*) echo "Live marker is not a commit sha: ${last}. ${recovery}" >&2; exit 1 ;;
            esac
            [ "${#last}" -eq 40 ] || { echo "Live marker is not a commit sha: ${last}. ${recovery}" >&2; exit 1; }
            git cat-file -e "${last}^{commit}" 2>/dev/null || { echo "Live commit ${last} is not in this checkout, refusing to deploy. ${recovery}" >&2; exit 1; }
            if [ "$last" != "$GITHUB_SHA" ]; then
              if git merge-base --is-ancestor "$GITHUB_SHA" "$last"; then
                echo "::warning::stale deploy skipped: ${GITHUB_SHA} is an ancestor of live ${last}"
                echo "deployed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git merge-base --is-ancestor "$last" "$GITHUB_SHA" || echo "::warning::live ${last} and ${GITHUB_SHA} have diverged, deploying"
            fi
          else
            case "$(cat "$err")" in
              *"matched no objects"*) ;;
              *) cat "$err" >&2; echo "Could not read the live deploy marker" >&2; exit 1 ;;
            esac
          fi
          rm -f "$err"
          # The bucket is publicly readable, so the marker exposes the deployed commit sha, which is acceptable (the source is the same sha
          # the site was built from). Cache-Control: no-store keeps it from being cached.
          write_marker() { printf '%s\n' "$GITHUB_SHA" | gcloud storage cp --cache-control=no-store - "$marker"; }
          # Write the marker BEFORE the rsync as an intent record, and again after it succeeds. The job lock means nothing else deploys
          # this site meanwhile, and the marker then names the commit whose files may be live from the first byte the rsync writes:
          #  - rsync fails or the runner dies midway: the site is a mix that includes this commit, and the marker already says so. An
          #    older run skips (correct: it must not overwrite this), the same commit redeploys (equal sha), a newer one deploys.
          #  - the write after the rsync fails: the marker is already right, so only the retries below were lost.
          #  - without the early write, a failure between the rsync and the final write would leave the marker at an older commit and
          #    let an even older run deploy over the newer files.
          write_marker || { echo "Could not write the deploy marker before the rsync, nothing was deployed" >&2; exit 1; }
          # .deploy/ is excluded so --delete-unmatched-destination-objects should never remove the marker. How that exclusion applies to
          # DESTINATION objects is unverified for gcloud storage rsync, and the canary recipe in the runbook checks it. A deletion would be
          # harmless: the marker was written before this rsync, is written again after it, and the job lock stops any other deploy
          # reading the gap.
          gcloud storage rsync --recursive --ignore-symlinks --checksums-only --delete-unmatched-destination-objects -x '^\.deploy/' \
            ./dist "gs://${GCS_BUCKET}/${WEBSITE}/"
          written=0
          for i in 1 2 3; do
            if write_marker; then written=1; break; fi
            if [ "$i" -lt 3 ]; then
              echo "deploy marker write attempt ${i}/3 failed; retrying in $((i * 5))s" >&2
              sleep $((i * 5))
            else
              echo "deploy marker write attempt ${i}/3 failed" >&2
            fi
          done
          [ "$written" = 1 ] || { echo "Could not write the deploy marker after the rsync" >&2; exit 1; }
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  # Liveness check. It runs in its own job, never in deploy-production: that job runs build code, so it must not hold a GitHub token (a
  # build could rewrite .git/config, shim PATH or set BASH_ENV to capture it). This job runs no build code and no git: it asks the REST API
  # whether the branch head is a descendant of the deployed commit (compare status "ahead"). It warns and never fails: the deploy has already
  # succeeded, so a lookup failure only produces a warning.
  check-newer-head:
    needs: deploy-production
    if: ${{ !cancelled() && needs.deploy-production.outputs.deployed == 'true' }}
    runs-on: self-hosted-k8s
    container:
      image: europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner@sha256:b8ae250c5d7fae79dbbea1f62ca7613ecabd6f3efbd13b533cbdecb293cdf814
    permissions:
      contents: read
    outputs:
      # The newer commit on main that is not deployed, or empty.
      newer_head: ${{ steps.newer.outputs.newer_head }}
    steps:
      - name: Warn when a newer commit is not deployed
        id: newer
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DEPLOYED_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const deployed = process.env.DEPLOYED_SHA;
            try {
              const { data: head } = await github.rest.repos.getCommit({ owner, repo, ref: process.env.BRANCH });
              if (head.sha === deployed) return;
              const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${deployed}...${head.sha}` });
              if (cmp.status === 'identical' || cmp.status === 'behind') return;
              if (cmp.status === 'ahead') {
                core.warning(`newer commit ${head.sha} on ${process.env.BRANCH} is not deployed yet; if its production run was cancelled, re-run it`);
                core.setOutput('newer_head', head.sha);
              } else if (cmp.status === 'diverged') {
                core.warning(`${process.env.BRANCH} head ${head.sha} has diverged from the deployed commit ${deployed} (force-push?); deploy it or see the runbook Deploy marker section`);
              } else {
                core.warning(`unexpected compare status ${cmp.status} between the deployed commit ${deployed} and ${process.env.BRANCH} head ${head.sha}; check manually`);
              }
            } catch (error) {
              core.warning(`could not check whether a newer commit on main is deployed (${error.message}); check manually`);
            }

  deploy-preview:
    needs: [preview-policy, build-preview]
    if: needs.preview-policy.outputs.trusted == 'true'
    runs-on: self-hosted-k8s
    container:
      image: europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner:latest-deploy-static-website@sha256:2f9a48587bfe0ba5db2fb4391ff40067633084e5885b07d84818c4342875154f
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: static-site-${{ inputs.website_slug }}
          path: dist

      - name: Reject non-regular artifact entries
        shell: bash
        run: |
          test -d dist
          bad=$(find dist \( -type l -o -type b -o -type c -o -type p -o -type s \) -print -quit) || exit 1
          if [ -n "$bad" ]; then
            echo "Static artifact contains a non-regular entry" >&2
            exit 1
          fi

      - name: Revalidate preview authorization
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          ACTOR: ${{ github.actor }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        with:
          github-token: ${{ github.token }}
          script: *preview-authorization

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: 'projects/1040576468442/locations/global/workloadIdentityPools/iamwipp-pipelines/providers/iamwipp-github-pipelines-beveriq'
          service_account: 'pipelines@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        env:
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud
        with:
          skip_install: true

      - name: Warm gcloud credential cache
        env:
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud
        run: |
          for i in 1 2 3 4 5; do
            gcloud storage ls "gs://${GCS_BUCKET}" > /dev/null && exit 0
            echo "gcloud warm-up attempt ${i}/5 failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "gcloud warm-up failed after 5 attempts" >&2
          exit 1

      - name: Deploy preview
        env:
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud
          CLOUDSDK_STORAGE_PROCESS_COUNT: '1'
          CLOUDSDK_STORAGE_THREAD_COUNT: '1'
          WEBSITE_SLUG: ${{ inputs.website_slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gcloud storage rsync --recursive --checksums-only --delete-unmatched-destination-objects \
            ./dist "gs://${GCS_BUCKET}/preview/${WEBSITE_SLUG}/pr${PR_NUMBER}"

      - name: Comment preview URL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          WEBSITE_SLUG: ${{ inputs.website_slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const slug = process.env.WEBSITE_SLUG;
            const prNumber = Number(process.env.PR_NUMBER);
            const previewUrl = `https://${slug}-pr${prNumber}.dev.cellarnode.com`;
            const marker = '<!-- cellarnode-static-preview -->';
            const body = `${marker}\n## Preview Deployment\n\nPreview available at: ${previewUrl}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const botComment = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              ((comment.body ?? '').includes(marker) || (comment.body ?? '').includes('## Preview Deployment'))
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted-k8s
    container:
      image: europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner:latest-deploy-static-website@sha256:2f9a48587bfe0ba5db2fb4391ff40067633084e5885b07d84818c4342875154f
    permissions:
      contents: read
      id-token: write
      pull-requests: read

    steps:
      - name: Revalidate cleanup authorization
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        with:
          github-token: ${{ github.token }}
          script: |
            const actor = process.env.ACTOR;
            const prNumber = Number(process.env.PR_NUMBER);
            const repository = process.env.REPOSITORY;
            const { data: pullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            });
            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: actor,
            });
            const authorized = pullRequest.state === 'closed' &&
              pullRequest.head.repo?.full_name === repository &&
              ['admin', 'maintain', 'write'].includes(access.permission);
            if (!authorized) {
              core.setFailed('Cleanup authorization is no longer valid');
            }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: 'projects/1040576468442/locations/global/workloadIdentityPools/iamwipp-pipelines/providers/iamwipp-github-pipelines-beveriq'
          service_account: 'pipelines@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        env:
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud
        with:
          skip_install: true

      - name: Delete preview
        env:
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud
          CLOUDSDK_STORAGE_PROCESS_COUNT: '1'
          CLOUDSDK_STORAGE_THREAD_COUNT: '1'
          WEBSITE_SLUG: ${{ inputs.website_slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PREVIEW_PREFIX="gs://${GCS_BUCKET}/preview/${WEBSITE_SLUG}/pr${PR_NUMBER}"
          PREVIEW_OBJECT=$(gcloud storage objects list "${PREVIEW_PREFIX}/**" --limit=1 --format='value(name)')
          if [ -n "$PREVIEW_OBJECT" ]; then
            gcloud storage rm --recursive "$PREVIEW_PREFIX"
          fi

  discord-thread-open:
    needs: preview-policy
    if: >-
      needs.preview-policy.outputs.trusted == 'true' &&
      (github.event.action == 'opened' || github.event.action == 'ready_for_review')
    permissions:
      pull-requests: write
    # CEL-2546: two overlapping runs for one PR (opened + ready_for_review, a re-run) must not both create a thread. They queue instead
    # (cancel-in-progress: false, a started thread-open is never killed mid-create), and the second sees the first's metadata comment.
    concurrency:
      group: discord-thread-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_open
      tags: ${{ inputs.discord_tags }}

  discord-build-update:
    needs: [preview-policy, build-preview, deploy-preview, discord-thread-open]
    if: >-
      always() &&
      needs.preview-policy.outputs.trusted == 'true' &&
      needs.build-preview.result != 'cancelled'
    permissions:
      pull-requests: write
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_update
      status: ${{ needs.build-preview.result == 'success' && (needs.deploy-preview.result == 'skipped' && 'success' || needs.deploy-preview.result) || needs.build-preview.result }}
      preview_url: ${{ needs.deploy-preview.result == 'success' && format('https://{0}-pr{1}.dev.cellarnode.com', inputs.website_slug, github.event.pull_request.number) || '' }}

  discord-thread-close:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_close
      status: ${{ github.event.pull_request.merged && 'merged' || 'closed' }}

  discord-deploy:
    needs: [deploy-production, check-newer-head]
    # CEL-2795: a separate job on its own runner, so the webhook secret never reaches the job that runs build code and holds id-token.
    # !cancelled(), not always(): a cancelled run must not wait for a runner just to post. Failures still notify. The production lock is on
    # deploy-production and the workflow group is unique per push run, so this job holds nothing the next deploy waits for.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: deploy
      # Only 'deployed == true' may say "Deployed to production". A stale skip, a skipped job and a cancelled job each get their own wording,
      # and a cancelled job (typically displaced by a newer pending run) tells the reader to re-run the newest main run.
      status: ${{ needs.deploy-production.result == 'success' && (needs.deploy-production.outputs.deployed == 'true' && 'success' || 'skipped') || needs.deploy-production.result }}
      deploy_title: >-
        ${{ needs.deploy-production.result == 'success' && (needs.deploy-production.outputs.deployed == 'true' && 'Deployed to production' || 'Not deployed: a newer commit is recorded as live (stale run skipped)')
        || needs.deploy-production.result == 'cancelled' && 'Not deployed: the production deploy was cancelled, re-run the newest main run'
        || needs.deploy-production.result == 'skipped' && 'Not deployed: the production deploy was skipped'
        || 'Production deploy failed' }}
      deploy_note: ${{ needs.check-newer-head.outputs.newer_head != '' && format('WARNING, newer commit {0} on main is not deployed. Re-run its production run.', needs.check-newer-head.outputs.newer_head) || '' }}
      tags: ${{ inputs.discord_tags }}
