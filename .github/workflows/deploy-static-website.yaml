name: Deploy Static Website

on:
  workflow_call:
    inputs:
      website:
        description: "Production hostname (e.g. admin.cellarnode.com)"
        required: true
        type: string
      website_slug:
        description: "Slug for preview URLs (e.g. admin-cellarnode-com)"
        required: true
        type: string
      build_env:
        description: "Build-time env vars as KEY=VALUE lines"
        required: false
        type: string
        default: ""
      typecheck:
        description: "Run pnpm tsc --noEmit before build"
        required: false
        type: boolean
        default: false
      lint:
        description: "Run pnpm lint before build"
        required: false
        type: boolean
        default: false
      frozen_lockfile:
        description: "Use --frozen-lockfile for pnpm install"
        required: false
        type: boolean
        default: true
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      pnpm_version:
        description: "Trusted pnpm version used for preview builds"
        required: false
        type: string
        default: "10.32.1"
      discord_tags:
        description: "Comma-separated Discord forum tag names (e.g. admin,importer)"
        required: false
        type: string
        default: ""
    secrets:
      NPM_TOKEN:
        description: "Read-only npm token used to fetch private @cellarnode packages"
        required: true
      DISCORD_WEBHOOK_URL:
        description: "Discord webhook credential"
        required: false

concurrency:
  group: static-deploy-${{ inputs.website_slug }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

env:
  PROJECT_ID: festive-terrain-478011-h0
  GCS_BUCKET: websites-deploy

jobs:
  preview-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.policy.outputs.trusted }}
    steps:
      - name: Evaluate preview trust boundary
        id: policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          same_repository=false
          if [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            same_repository=true
          fi

          actor_matches_author=false
          if [ "$ACTOR" = "$AUTHOR" ]; then
            actor_matches_author=true
          fi

          permission_allowed=false
          if [ "$EVENT_NAME" = "pull_request" ] &&
            [ "$same_repository" = "true" ] &&
            [ "$actor_matches_author" = "true" ]; then
            permission="$(gh api "repos/${REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission)"
            case "$permission" in
              admin|maintain|write) permission_allowed=true ;;
            esac
          fi

          trusted=false
          if [ "$EVENT_NAME" = "pull_request" ] &&
            [ "$EVENT_ACTION" != "closed" ] &&
            [ "$same_repository" = "true" ] &&
            [ "$permission_allowed" = "true" ] &&
            [ "$actor_matches_author" = "true" ]; then
            trusted=true
          fi

          printf 'trusted=%s\n' "$trusted" >> "$GITHUB_OUTPUT"
          printf 'preview policy: event=%s action=%s same_repository=%s permission_allowed=%s actor_matches_author=%s trusted=%s\n' \
            "$EVENT_NAME" "$EVENT_ACTION" "$same_repository" "$permission_allowed" "$actor_matches_author" "$trusted"

  build-preview:
    needs: preview-policy
    if: needs.preview-policy.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: ${{ inputs.pnpm_version }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node_version }}

      - name: Checkout pull-request source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install dependencies with scoped registry credential
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/cellarnode-preview-npmrc
        run: |
          validate_lock() {
            ruby - "$1" <<'RUBY'
          require "yaml"

          path = ARGV.fetch(0)
          external_source = /(?:\A|@)(?:git\+|git@|git:\/\/|ssh:\/\/|github:|gitlab:|bitbucket:|https?:\/\/|file:)/i
          workspace_source = /\A(?:link:|workspace:)/i
          allowed_workspace_ref = lambda do |keys|
            keys.first == "importers" && %w[specifier version].include?(keys.last)
          end
          failures = []
          visit = lambda do |value, keys|
            case value
            when Hash
              value.each do |key, child|
                name = key.to_s
                child_keys = keys + [name]
                if name == "resolution"
                  valid_resolution = child.is_a?(Hash) &&
                    child.keys.map(&:to_s) == ["integrity"] &&
                    child["integrity"].is_a?(String) &&
                    child["integrity"].match?(/\Asha(?:1|256|384|512)-[A-Za-z0-9+\/]+={0,2}\z/)
                  failures << child_keys.join(".") unless valid_resolution
                end
                if external_source.match?(name) ||
                   (workspace_source.match?(name) && !allowed_workspace_ref.call(child_keys))
                  failures << child_keys.join(".")
                end
                if keys.last == "resolution" && name != "integrity"
                  failures << child_keys.join(".")
                end
                visit.call(child, child_keys)
              end
            when Array
              value.each_with_index { |child, index| visit.call(child, keys + [index.to_s]) }
            when String
              if external_source.match?(value) ||
                 (workspace_source.match?(value) && !allowed_workspace_ref.call(keys))
                failures << keys.join(".")
              end
            end
          end

          visit.call(YAML.safe_load(File.read(path), aliases: true), [])
          abort "Preview dependency lock contains a non-registry source at #{failures.uniq.join(', ')}" unless failures.empty?
          RUBY
          }

          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is required to fetch private @cellarnode packages" >&2
            exit 1
          fi
          rm -f -- .npmrc .pnpmfile.cjs "$NPM_CONFIG_USERCONFIG"
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          umask 077
          printf '%s\n' \
            '@cellarnode:registry=https://registry.npmjs.org/' \
            "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" \
            > "$NPM_CONFIG_USERCONFIG"
          if [ ! -f pnpm-lock.yaml ] || [ -L pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml must be a regular file" >&2
            exit 1
          fi
          validate_lock pnpm-lock.yaml
          pnpm install ${{ inputs.frozen_lockfile && '--frozen-lockfile' || '--no-frozen-lockfile' }} --ignore-scripts --ignore-pnpmfile
          validate_lock pnpm-lock.yaml

      - name: Verify credential isolation
        env:
          NPM_TOKEN: ""
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/cellarnode-preview-npmrc
        run: |
          test -z "$NPM_TOKEN"
          test ! -e "$NPM_CONFIG_USERCONFIG"
          test ! -e .npmrc
          test ! -e .pnpmfile.cjs

      - name: Rebuild dependencies
        env:
          NPM_TOKEN: ""
        run: pnpm rebuild

      - name: Type check
        if: inputs.typecheck
        env:
          NPM_TOKEN: ""
        run: pnpm tsc --noEmit

      - name: Lint
        if: inputs.lint
        env:
          NPM_TOKEN: ""
        run: pnpm lint

      - name: Build preview
        shell: bash
        env:
          BUILD_ENV_VARS: ${{ inputs.build_env }}
          NPM_TOKEN: ""
        run: |
          if [ -n "$BUILD_ENV_VARS" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && export "${line?}"
            done <<< "$BUILD_ENV_VARS"
          fi
          pnpm build

      - name: Upload static site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-site-${{ inputs.website_slug }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  build-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: ${{ inputs.pnpm_version }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node_version }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install dependencies with scoped registry credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/cellarnode-production-npmrc
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is required to fetch private @cellarnode packages" >&2
            exit 1
          fi
          rm -f -- .npmrc .pnpmfile.cjs "$NPM_CONFIG_USERCONFIG"
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          umask 077
          printf '%s\n' \
            '@cellarnode:registry=https://registry.npmjs.org/' \
            "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" \
            > "$NPM_CONFIG_USERCONFIG"
          pnpm install ${{ inputs.frozen_lockfile && '--frozen-lockfile' || '--no-frozen-lockfile' }} --ignore-scripts --ignore-pnpmfile

      - name: Verify credential isolation
        env:
          NPM_TOKEN: ""
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/cellarnode-production-npmrc
        run: |
          test -z "$NPM_TOKEN"
          test ! -e "$NPM_CONFIG_USERCONFIG"
          test ! -e .npmrc
          test ! -e .pnpmfile.cjs

      - name: Rebuild dependencies
        env:
          NPM_TOKEN: ""
        run: pnpm rebuild

      - name: Type check
        if: inputs.typecheck
        env:
          NPM_TOKEN: ""
        run: pnpm tsc --noEmit

      - name: Lint
        if: inputs.lint
        env:
          NPM_TOKEN: ""
        run: pnpm lint

      - name: Build production
        shell: bash
        env:
          BUILD_ENV_VARS: ${{ inputs.build_env }}
          NPM_TOKEN: ""
        run: |
          if [ -n "$BUILD_ENV_VARS" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && export "${line?}"
            done <<< "$BUILD_ENV_VARS"
          fi
          pnpm build

      - name: Upload static site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-site-${{ inputs.website_slug }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    needs: build-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted-k8s
    container:
      image: europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner@sha256:e57fadf58eb4e125a101f366a9cd97cb022e3cb8a9eae6028cefdfb0003b2960
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: static-site-${{ inputs.website_slug }}
          path: dist

      - name: Reject non-regular artifact entries
        shell: bash
        run: |
          test -d dist
          if find dist \( -type l -o -type b -o -type c -o -type p -o -type s \) -print -quit | grep -q .; then
            echo "Static artifact contains a non-regular entry" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: 'projects/1040576468442/locations/global/workloadIdentityPools/iamwipp-pipelines/providers/iamwipp-github-pipelines-beveriq'
          service_account: 'pipelines@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        env:
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud
        with:
          skip_install: true

      - name: Warm gcloud credential cache
        env:
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud
        run: |
          for i in 1 2 3 4 5; do
            gcloud storage ls "gs://${GCS_BUCKET}" > /dev/null && exit 0
            echo "gcloud warm-up attempt ${i}/5 failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "gcloud warm-up failed after 5 attempts" >&2
          exit 1

      - name: Deploy to production
        env:
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud
          WEBSITE: ${{ inputs.website }}
        run: |
          gcloud storage rsync --recursive --checksums-only --delete-unmatched-destination-objects \
            ./dist "gs://${GCS_BUCKET}/${WEBSITE}"

  deploy-preview:
    needs: [preview-policy, build-preview]
    if: needs.preview-policy.outputs.trusted == 'true'
    runs-on: self-hosted-k8s
    container:
      image: europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner@sha256:e57fadf58eb4e125a101f366a9cd97cb022e3cb8a9eae6028cefdfb0003b2960
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: static-site-${{ inputs.website_slug }}
          path: dist

      - name: Reject non-regular artifact entries
        shell: bash
        run: |
          test -d dist
          if find dist \( -type l -o -type b -o -type c -o -type p -o -type s \) -print -quit | grep -q .; then
            echo "Static artifact contains a non-regular entry" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: 'projects/1040576468442/locations/global/workloadIdentityPools/iamwipp-pipelines/providers/iamwipp-github-pipelines-beveriq'
          service_account: 'pipelines@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        env:
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud
        with:
          skip_install: true

      - name: Warm gcloud credential cache
        env:
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud
        run: |
          for i in 1 2 3 4 5; do
            gcloud storage ls "gs://${GCS_BUCKET}" > /dev/null && exit 0
            echo "gcloud warm-up attempt ${i}/5 failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "gcloud warm-up failed after 5 attempts" >&2
          exit 1

      - name: Deploy preview
        env:
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud
          WEBSITE_SLUG: ${{ inputs.website_slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gcloud storage rsync --recursive --checksums-only --delete-unmatched-destination-objects \
            ./dist "gs://${GCS_BUCKET}/preview/${WEBSITE_SLUG}/pr${PR_NUMBER}"

      - name: Comment preview URL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          WEBSITE_SLUG: ${{ inputs.website_slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const slug = process.env.WEBSITE_SLUG;
            const prNumber = Number(process.env.PR_NUMBER);
            const previewUrl = `https://${slug}-pr${prNumber}.dev.cellarnode.com`;
            const marker = '<!-- cellarnode-static-preview -->';
            const body = `${marker}\n## Preview Deployment\n\nPreview available at: ${previewUrl}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const botComment = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              ((comment.body ?? '').includes(marker) || (comment.body ?? '').includes('## Preview Deployment'))
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted-k8s
    container:
      image: europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner@sha256:e57fadf58eb4e125a101f366a9cd97cb022e3cb8a9eae6028cefdfb0003b2960
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: 'projects/1040576468442/locations/global/workloadIdentityPools/iamwipp-pipelines/providers/iamwipp-github-pipelines-beveriq'
          service_account: 'pipelines@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        env:
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud
        with:
          skip_install: true

      - name: Delete preview
        env:
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud
          WEBSITE_SLUG: ${{ inputs.website_slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PREVIEW_PREFIX="gs://${GCS_BUCKET}/preview/${WEBSITE_SLUG}/pr${PR_NUMBER}"
          PREVIEW_OBJECT=$(gcloud storage objects list "${PREVIEW_PREFIX}/**" --limit=1 --format='value(name)')
          if [ -n "$PREVIEW_OBJECT" ]; then
            gcloud storage rm --recursive "$PREVIEW_PREFIX"
          fi

  discord-thread-open:
    needs: preview-policy
    if: >-
      needs.preview-policy.outputs.trusted == 'true' &&
      github.event.action == 'opened'
    permissions:
      pull-requests: write
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_open
      tags: ${{ inputs.discord_tags }}

  discord-build-update:
    needs: [preview-policy, build-preview, deploy-preview, discord-thread-open]
    if: >-
      always() &&
      needs.preview-policy.outputs.trusted == 'true' &&
      needs.build-preview.result != 'cancelled'
    permissions:
      pull-requests: write
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_update
      status: ${{ needs.build-preview.result == 'success' && (needs.deploy-preview.result == 'skipped' && 'success' || needs.deploy-preview.result) || needs.build-preview.result }}
      preview_url: ${{ needs.deploy-preview.result == 'success' && format('https://{0}-pr{1}.dev.cellarnode.com', inputs.website_slug, github.event.pull_request.number) || '' }}

  discord-thread-close:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_close
      status: ${{ github.event.pull_request.merged && 'merged' || 'closed' }}

  discord-deploy:
    needs: [build-production, deploy-production]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: deploy
      status: ${{ needs.build-production.result == 'success' && needs.deploy-production.result || needs.build-production.result }}
      tags: ${{ inputs.discord_tags }}
