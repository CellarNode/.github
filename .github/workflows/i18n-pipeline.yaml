name: i18n — Sync + Translate

# Consumer requirements (CEL-436 / CEL-449):
#
#   1. `i18next-cli` AND `polyglot-i18n` MUST be present in the
#      consumer's `devDependencies`. pnpm exec resolves to the
#      lockfile-pinned versions; no global fallback. Current consumers:
#      producer-dashboard, importer-dashboard, cellarnode-public-site.
#
#   2. The caller MUST forward `GOOGLE_API_KEY` and `I18N_PIPELINE_TOKEN`
#      via `secrets: inherit`. NPM_TOKEN is NOT used any more: every
#      `@cellarnode/*` package is public on npm since 2026-09-15
#      (CEL-1983), so `pnpm install` here needs no registry credential.
#
#   3. OPTIONAL (CEL-1551): a `format:i18n` script. Define it if the
#      consumer's formatter would reformat any file this pipeline
#      regenerates; today that is `src/@types/resources.d.ts`, because
#      `i18next-cli types` always emits quoted interface keys that oxfmt
#      unquotes. Without the script, bot PRs land generated files that
#      fail the consumer's own format gate (importer PR #283). The step
#      is invoked as `pnpm run --if-present -s format:i18n`, so a repo
#      that defines no script is unaffected. Three constraints bind any
#      repo that DOES define one:
#
#        a. Scope it to generated paths only. It must never be a
#           repo-wide format, which would drag unrelated source churn
#           into an automated translation PR.
#        b. Keep it inside `$LOCALES_PATH/`, `.polyglot-cache.json`, or
#           `src/`. Change detection diffs tracked-file changes and the
#           commit stages only those three paths, so an out-of-scope
#           write to a tracked file is silently dropped when in-scope
#           changes exist, reddens the run when it is the only change,
#           and a new untracked file outside them is a green no-op.
#        c. The target MUST NOT be excluded by the consumer's own
#           formatter ignore config. oxfmt exits 2 on a fully-excluded
#           target ("Expected at least one target file"), and this step
#           carries no `|| true`, so an ignore entry left in place while
#           `format:i18n` points at that path reddens EVERY run of this
#           pipeline for that repo, including runs with no diff. Remove
#           the ignore entry and add the script in the same change.
#
# Misconfiguration surfaces as a RED workflow run (CEL-434 removed the
# `|| true` that previously masked these failures).

on:
  workflow_call:
    inputs:
      force-translate:
        description: 'Force retranslate all keys'
        required: false
        type: boolean
        default: false
      context:
        description: 'Domain context for Gemini translation'
        required: false
        type: string
        default: 'Beverage industry B2B platform'
      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '22'
      locales_path:
        description: 'Path to locales directory'
        required: false
        type: string
        default: 'public/locales'
      target_languages:
        description: 'Comma-separated target language codes'
        required: false
        type: string
        default: 'zh,fr,de,it,es,sv,ru'
    secrets:
      GOOGLE_API_KEY:
        required: true
      DISCORD_WEBHOOK_URL:
        description: 'Discord webhook credential'
        required: false
      I18N_PIPELINE_TOKEN:
        description: >-
          Fine-grained PAT (Contents RW + Pull requests RW on the consumer
          repos) used to push the generated branch and create its PR through
          REST so `on: pull_request` CI fires. Callers on `secrets: inherit`
          forward the organization secret automatically; explicit-map callers
          must forward it by name.
        required: true

jobs:
  sync-translate:
    runs-on: >-
      ${{ github.event.repository.private == true &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          'self-hosted-k8s' || 'ubuntu-latest' }}
    container: >-
      ${{ github.event.repository.private == true &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          'europe-north1-docker.pkg.dev/festive-terrain-478011-h0/beveriq/ci-runner@sha256:b8ae250c5d7fae79dbbea1f62ca7613ecabd6f3efbd13b533cbdecb293cdf814'
          || '' }}
    # CEL-1259 step 3 — when auto-merge lands our own "chore(i18n): sync +
    # translate" squash on the base branch, the callers' `push` +
    # `paths: ['src/**']` trigger would re-run this whole pipeline (bounded:
    # the committed .polyglot-cache.json makes it a cache-hit no-diff run,
    # but it still costs an install + Gemini pass). Skip that self-echo run.
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(i18n): sync + translate')"
    # CEL-1259 — serialize per consumer repo. `github.repository` in a reusable
    # workflow resolves to the *caller's* repo, so each consumer gets its own
    # queue and consumers never block each other. Without this, two overlapping
    # runs would each create a PR and each close step excludes only its OWN new
    # PR — so the runs close each other's fresh PR and the repo can end up with
    # churned or zero open i18n PRs. `cancel-in-progress: false` because
    # cancelling mid-run can leave a pushed branch with no PR attached to it.
    concurrency:
      group: i18n-pipeline-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Create PR must authenticate both its push and REST call with the
          # same token. Otherwise checkout's persisted github.token can make
          # the push succeed while a stale PAT fails seconds later.
          persist-credentials: false

      # CEL-2768 — a self-hosted container job runs as root in a workspace the
      # runner user owns. actions/checkout trusts that directory only through
      # a temporary HOME it discards when it finishes, so every later `git`
      # call saw a dubious-ownership checkout: `git diff` fell back to
      # `--no-index` (exit 129) and `git config` died with "not in a git
      # directory". Trust the workspace for the rest of the job through the
      # environment, which holds whatever HOME a step runs with.
      - name: Trust the workspace for git
        run: |
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=safe.directory"
            echo "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"

      - name: Verify git can read the workspace
        run: |
          if ! git rev-parse --is-inside-work-tree >/dev/null; then
            echo "::error title=Workspace not readable by git::The checkout is not usable as a git repository (dubious ownership or a missing .git directory)."
            exit 1
          fi

      # Fail before the install and the Gemini pass, not after them, when the
      # token that Create PR depends on never reached the job. An empty value
      # is not a masked one: it appears as a blank `GH_TOKEN:` in the step env.
      - name: Verify I18N_PIPELINE_TOKEN is present
        env:
          I18N_PIPELINE_TOKEN: ${{ secrets.I18N_PIPELINE_TOKEN }}
        run: |
          if [[ -z "${I18N_PIPELINE_TOKEN//[[:space:]]/}" ]]; then
            echo "::error title=I18N_PIPELINE_TOKEN empty::The secret resolved to an empty value in this job."
            echo "::error::A repository-level secret named I18N_PIPELINE_TOKEN overrides the organization secret of the same name; delete it or give it a valid value."
            echo "::error::Otherwise check that this repository is in the organization secret's selected repositories and that the caller passes 'secrets: inherit'."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node_version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      # CEL-449 — drop the `npm install -g polyglot-i18n` step. All 3
      # consumers now have `polyglot-i18n` as a local devDep (PR #172,
      # #89, #22), so the translate step below can resolve via `pnpm
      # exec` against the lockfile-pinned version. Same hardening as
      # CEL-436 did for `i18next-cli`. With both tools lockfile-pinned,
      # this workflow no longer carries any floating npm dependencies.
      #
      # CEL-436 — `pnpm exec` (not `npx`) resolves to the consumer's
      # local `i18next-cli` devDep, so the workflow uses the lockfile-
      # pinned version deterministically. `npx` would silently install
      # from the live registry if the global install were missing.
      - name: Sync locale files
        run: pnpm exec i18next-cli sync

      - name: Translate new/changed keys
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FORCE_TRANSLATE: ${{ inputs.force-translate }}
          LOCALES_PATH: ${{ inputs.locales_path }}
          TARGET_LANGUAGES: ${{ inputs.target_languages }}
          TRANSLATION_CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          BASE_CACHE="$RUNNER_TEMP/polyglot-cache-base.json"
          if [ -f .polyglot-cache.json ]; then
            cp .polyglot-cache.json "$BASE_CACHE"
          else
            printf '{}\n' > "$BASE_CACHE"
          fi

          if [[ -z "$TARGET_LANGUAGES" ]]; then
            echo "::error::Target language code must not be empty"
            exit 1
          fi
          if [[ "$TARGET_LANGUAGES" == *$'\n'* || "$TARGET_LANGUAGES" == *$'\r'* ]]; then
            echo "::error::Target language code must not contain line breaks"
            exit 1
          fi
          if [[ "$TARGET_LANGUAGES" == *, ]]; then
            echo "::error::Target language code must not be empty"
            exit 1
          fi
          IFS=',' read -r -a languages <<< "$TARGET_LANGUAGES"
          for language_index in "${!languages[@]}"; do
            language="$(printf '%s' "${languages[language_index]}" | tr -d '[:space:]')"
            if [ -z "$language" ]; then
              echo "::error::Target language code must not be empty"
              exit 1
            fi
            languages[language_index]="$language"
          done

          for ((language_index = 0; language_index < ${#languages[@]}; language_index++)); do
            for ((prior_index = 0; prior_index < language_index; prior_index++)); do
              if [[ "${languages[language_index]}" == "${languages[prior_index]}" ]]; then
                echo "::error::Duplicate target language after normalization"
                exit 1
              fi
            done
          done

          PACKAGE_VERSION="$(node - <<'NODE'
          const { createRequire } = require("node:module");
          const { dirname, resolve } = require("node:path");
          const { readFileSync } = require("node:fs");
          const localRequire = createRequire(resolve(process.cwd(), "package.json"));
          let packageDir;
          try {
            packageDir = dirname(localRequire.resolve("polyglot-i18n"));
          } catch {
            console.error("::error::Cannot resolve the consumer's installed polyglot-i18n package");
            process.exit(1);
          }
          for (;;) {
            try {
              const pkg = JSON.parse(readFileSync(resolve(packageDir, "package.json"), "utf8"));
              if (pkg.name === "polyglot-i18n") {
                process.stdout.write(String(pkg.version));
                process.exit(0);
              }
            } catch {}
            const parent = dirname(packageDir);
            if (parent === packageDir) break;
            packageDir = parent;
          }
          console.error("::error::Cannot identify the consumer's installed polyglot-i18n version");
          process.exit(1);
          NODE
          )"
          case "$PACKAGE_VERSION" in
            0.4.1|0.2.4) ;;
            *)
              echo "::error::Unsupported polyglot-i18n version; this workflow supports 0.2.4 and 0.4.1. Review caller compatibility before changing its lockfile pin."
              exit 1
              ;;
          esac

          node - "$PACKAGE_VERSION" "$BASE_CACHE" <<'NODE'
          const fs = require("node:fs");
          const [version, basePath] = process.argv.slice(2);
          const fail = (message) => { console.error(`::error::${message}`); process.exit(1); };
          const isObject = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
          const validateEntry = (entry) => {
            if (typeof entry === "string") return true;
            if (!isObject(entry) || Object.keys(entry).some((key) => key !== "hash" && key !== "langs")) return false;
            if (Object.hasOwn(entry, "hash") && typeof entry.hash !== "string") return false;
            if (!Object.hasOwn(entry, "langs")) return true;
            if (!isObject(entry.langs)) return false;
            return Object.values(entry.langs).every((raw) => {
              if (raw === "stale" || raw === "accepted") return true;
              return isObject(raw) &&
                Object.keys(raw).every((key) => key === "hash" || key === "state") &&
                (!Object.hasOwn(raw, "hash") || typeof raw.hash === "string") &&
                (!Object.hasOwn(raw, "state") || raw.state === "stale" || raw.state === "accepted");
            });
          };
          let base;
          try { base = JSON.parse(fs.readFileSync(basePath, "utf8")); }
          catch { fail("Original translation cache is malformed; no translation was attempted"); }
          if (!isObject(base) || !Object.values(base).every((namespace) =>
            isObject(namespace) && Object.values(namespace).every(validateEntry))) {
            fail("Original translation cache schema is unsupported; no translation was attempted");
          }
          if (version === "0.2.4" && Object.values(base).some((namespace) =>
            Object.values(namespace).some((entry) => typeof entry !== "string"))) {
            fail("Legacy polyglot-i18n 0.2.4 requires a bare-string cache; no translation was attempted");
          }
          NODE

          cache_files=()
          index=0
          for language in "${languages[@]}"; do
            language_cache="$RUNNER_TEMP/polyglot-cache-$index.json"
            cp "$BASE_CACHE" "$language_cache"
            translate_args=(
              --input "./$LOCALES_PATH/en"
              --output-languages "$language"
              --provider gemini
              --api-key "$GOOGLE_API_KEY"
              --context "$TRANSLATION_CONTEXT"
              --cache-file "$language_cache"
            )
            if [ "$FORCE_TRANSLATE" = "true" ]; then
              translate_args+=(--force)
            fi
            pnpm exec polyglot-i18n translate "${translate_args[@]}"
            cache_files+=("$language_cache")
            index=$((index + 1))
          done

          cache_candidate="$RUNNER_TEMP/polyglot-cache-merged.json"
          node - "$PACKAGE_VERSION" "$BASE_CACHE" "$cache_candidate" "${languages[@]}" -- "${cache_files[@]}" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const [version, basePath, candidatePath, ...rest] = process.argv.slice(2);
          const separator = rest.indexOf("--");
          if (separator < 0) {
            console.error("::error::Translation cache aggregation arguments are invalid");
            process.exit(1);
          }
          const languages = rest.slice(0, separator);
          const cachePaths = rest.slice(separator + 1);
          if (languages.length === 0 || languages.length !== cachePaths.length) {
            console.error("::error::Translation cache aggregation inputs are incomplete");
            process.exit(1);
          }

          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exit(1);
          };
          const isObject = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
          const dictionary = () => Object.create(null);
          const own = (object, key) => Object.hasOwn(object, key);
          const readJson = (file) => {
            try {
              const value = JSON.parse(fs.readFileSync(file, "utf8"));
              if (!isObject(value)) fail("Translation cache must contain a JSON object");
              return value;
            } catch {
              fail("Translation cache is missing or malformed; tracked cache was not updated");
            }
          };
          const validateEntry = (entry) => {
            if (typeof entry === "string") return;
            if (!isObject(entry)) fail("Translation cache contains an unsupported entry");
            for (const key of Object.keys(entry)) {
              if (key !== "hash" && key !== "langs") fail("Translation cache contains an unsupported record field");
            }
            if (own(entry, "hash") && typeof entry.hash !== "string") fail("Translation cache hash must be a string");
            if (own(entry, "langs")) {
              if (!isObject(entry.langs)) fail("Translation cache languages must be an object");
              for (const raw of Object.values(entry.langs)) {
                if (raw === "stale" || raw === "accepted") continue;
                if (!isObject(raw)) fail("Translation cache language provenance is malformed");
                for (const key of Object.keys(raw)) {
                  if (key !== "hash" && key !== "state") fail("Translation cache provenance contains an unsupported field");
                }
                if (own(raw, "hash") && typeof raw.hash !== "string") fail("Translation cache provenance hash must be a string");
                if (own(raw, "state") && raw.state !== "stale" && raw.state !== "accepted") {
                  fail("Translation cache provenance state is unsupported");
                }
              }
            }
          };
          const validateCache = (cache) => {
            for (const namespace of Object.values(cache)) {
              if (!isObject(namespace)) fail("Translation cache namespace must be an object");
              for (const entry of Object.values(namespace)) validateEntry(entry);
            }
          };
          const canonical = (value) => {
            if (Array.isArray(value)) return value.map(canonical);
            if (!isObject(value)) return value;
            const result = dictionary();
            for (const key of Object.keys(value).sort()) result[key] = canonical(value[key]);
            return result;
          };
          const same = (left, right) => JSON.stringify(canonical(left)) === JSON.stringify(canonical(right));

          const base = readJson(basePath);
          const outputs = cachePaths.map(readJson);
          validateCache(base);
          outputs.forEach(validateCache);

          if (version === "0.2.4") {
            const allBare = outputs.every((cache) =>
              Object.values(cache).every((namespace) => Object.values(namespace).every((entry) => typeof entry === "string")),
            );
            if (!allBare || outputs.some((cache) => !same(cache, outputs[0]))) {
              fail("Legacy translation cache outputs were inconsistent; tracked cache was not updated");
            }
            fs.writeFileSync(candidatePath, `${JSON.stringify(outputs.at(-1), null, 2)}\n`);
            process.exit(0);
          }

          if (version !== "0.4.1") fail("Unsupported polyglot-i18n cache version");
          const namespaceNames = Object.keys(outputs[0]).sort();
          const keyNamesByNamespace = dictionary();
          for (const namespace of namespaceNames) {
            keyNamesByNamespace[namespace] = Object.keys(outputs[0][namespace]).sort();
          }
          for (const output of outputs.slice(1)) {
            if (!same(Object.keys(output).sort(), namespaceNames)) {
              fail("Translation cache outputs have inconsistent namespaces; tracked cache was not updated");
            }
            for (const namespace of namespaceNames) {
              if (!same(Object.keys(output[namespace]).sort(), keyNamesByNamespace[namespace])) {
                fail("Translation cache outputs have inconsistent keys; tracked cache was not updated");
              }
            }
          }

          const defaultOf = (entry) => {
            if (typeof entry === "string") return { present: true, hash: entry, langs: dictionary() };
            if (!entry) return { present: false, hash: undefined, langs: dictionary() };
            const langs = dictionary();
            for (const [language, record] of Object.entries(entry.langs ?? {})) langs[language] = record;
            return { present: own(entry, "hash"), hash: entry.hash, langs };
          };
          const resolvedFor = (entry, language) => {
            if (typeof entry === "string") return { present: true, explicit: false, record: { hash: entry } };
            const langs = entry.langs ?? dictionary();
            if (own(langs, language)) {
              const raw = langs[language];
              if (raw === "stale" || raw === "accepted") return { present: true, explicit: true, record: { state: raw } };
              const record = dictionary();
              if (own(raw, "hash")) record.hash = raw.hash;
              if (own(raw, "state")) record.state = raw.state;
              return { present: true, explicit: true, record };
            }
            if (own(entry, "hash")) return { present: true, explicit: false, record: { hash: entry.hash } };
            return { present: false, explicit: false, record: dictionary() };
          };
          const mergeEntry = (original, languageResults) => {
            const originalInfo = defaultOf(original);
            const langs = dictionary();
            for (const [otherLanguage, record] of Object.entries(originalInfo.langs)) {
              langs[otherLanguage] = record;
            }
            languages.forEach((language, index) => {
              const resolved = resolvedFor(languageResults[index], language);
              if (!resolved.present) {
                if (originalInfo.present) langs[language] = dictionary();
                else delete langs[language];
                return;
              }
              const record = resolved.record;
              const hasHash = own(record, "hash");
              const state = record.state;
              const sameAsDefault = !state && (
                (hasHash && originalInfo.present && record.hash === originalInfo.hash) ||
                (!hasHash && !originalInfo.present)
              );
              const hashlessOverridesKnownDefault = resolved.explicit && !hasHash && originalInfo.present && !state;
              if (sameAsDefault && !hashlessOverridesKnownDefault) delete langs[language];
              else langs[language] = record;
            });

            if (originalInfo.present && Object.keys(langs).length === 0) return originalInfo.hash;
            return originalInfo.present ? { hash: originalInfo.hash, langs } : { langs };
          };

          const merged = dictionary();
          for (const [namespace, entries] of Object.entries(base)) merged[namespace] = entries;
          for (const namespace of namespaceNames) {
            const current = dictionary();
            const keys = keyNamesByNamespace[namespace];
            const originalNamespace = own(base, namespace) ? base[namespace] : undefined;
            for (const key of keys) {
              const languageResults = outputs.map((output) => output[namespace][key]);
              const originalEntry = originalNamespace && own(originalNamespace, key) ? originalNamespace[key] : undefined;
              current[key] = mergeEntry(originalEntry, languageResults);
            }
            merged[namespace] = current;
          }
          fs.writeFileSync(candidatePath, `${JSON.stringify(merged, null, 2)}\n`);
          NODE

          tracked_candidate=".polyglot-cache.json.candidate.$$"
          trap 'rm -f "$tracked_candidate"' EXIT
          cp "$cache_candidate" "$tracked_candidate"
          mv -f "$tracked_candidate" .polyglot-cache.json

      # CEL-434 — `|| true` REMOVED. Previously this step silently swallowed
      # failures. When `i18next-cli types` failed (e.g., because the consuming
      # repo lacked `i18next-cli` as a devDep so the CLI couldn't resolve the
      # project-specific TS config), the workflow continued past this step
      # without regenerating `src/@types/resources.d.ts`. Bot PRs then landed
      # with locale changes but no regenerated types — producing the
      # CEL-417 producer-dashboard scenario where typed i18n key checking
      # silently degraded over weeks. Failure here now correctly turns the
      # whole pipeline red so the regression surfaces at PR time.
      #
      # CEL-436 — `npx` → `pnpm exec` per the same rationale as the sync
      # step above. Uses the consumer's locked i18next-cli devDep.
      - name: Generate TypeScript types
        run: pnpm exec i18next-cli types

      # CEL-1551 — the `i18next-cli types` emitter is not format-stable: it
      # always writes quoted interface keys (`"auth": { ... }`), which the
      # consumers' formatter then unquotes. Bot PRs therefore landed types
      # that failed the consumer's own `make format-check`, and importer
      # PR #283 had to be rescued by hand with a follow-up format commit
      # (8024be9d) before it could merge. Formatting here, between generation
      # and the `git add` below, makes the committed types house-formatted in
      # the same run that regenerates them.
      #
      # Contract: opt-in, and scoped by the consumer rather than by us. A repo
      # with no `format:i18n` script behaves exactly as it did before this
      # step existed. A repo that defines one owns which paths it touches, and
      # that script must name only generated paths. It must never be a
      # repo-wide format, which would drag unrelated source churn into an
      # automated translation PR. The full opt-in contract, including the two
      # ways a badly-wired script turns this step permanently red (a write
      # outside the staged paths, and a target excluded by the consumer's own
      # formatter ignore config), is requirement 3 at the top of this file.
      #
      # `--if-present` must precede the script name. pnpm only parses its own
      # flags before the script name; placed after it, pnpm forwards the flag
      # to the script and a missing script still exits 1. Verified on pnpm
      # 10.32.1 (importer-dashboard) and 10.28.2 (producer-dashboard,
      # cellarnode-public-site); `pnpm/action-setup@v4` above pins no version,
      # so each consumer runs its own `packageManager` pnpm. Flag-parsing
      # semantics are unchanged across 10.x. A script that exists and fails
      # still exits non-zero and reddens the pipeline, matching the CEL-434
      # posture of the step above.
      - name: Format regenerated types
        run: pnpm run --if-present -s format:i18n

      - name: Check for changes
        id: diff
        env:
          LOCALES_PATH: ${{ inputs.locales_path }}
        run: |
          # Look at exactly the paths Create PR stages, and count untracked
          # files: a run whose only output is a new namespace or language file,
          # or a first `.polyglot-cache.json`, is a change. (`git diff` ignores
          # untracked files, so it reported changed=false and opened no PR.)
          # A git failure must fail the step. The old `a && b || c` chain read
          # `git diff` exiting 129 outside a repository as "changed" and sent
          # the run on to Create PR with a broken checkout.
          rc=0
          changes="$(git status --porcelain -- "$LOCALES_PATH" .polyglot-cache.json src/)" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Change detection failed::git status exited $rc, so the working tree could not be inspected."
            exit "$rc"
          fi
          if [ -n "$changes" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # CEL-1259 step 1/3 — the replacement PR is opened FIRST, and only then
      # are the predecessors it supersedes closed (next step). Ordering matters:
      # closing first meant a failed `git push` / `gh pr create` destroyed every
      # predecessor PR *and* its branch with nothing opened in their place.
      #
      # The branch name carries seconds (`%H%M%S`, was `%H%M`) so two runs that
      # reach this step inside the same minute cannot collide on one branch name
      # and turn the second push into a non-fast-forward rejection.
      - name: Ensure GitHub CLI is available
        if: >-
          github.event.repository.private == true &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          steps.diff.outputs.changed == 'true'
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends gh
          fi
          gh --version

      - name: Create PR
        id: create_pr
        if: steps.diff.outputs.changed == 'true'
        env:
          # CEL-1259 step 2/3 — the organization PAT is the sole credential for
          # branch push and REST PR creation. github.token-authored PRs never
          # trigger `on: pull_request`, so falling back would park CI at
          # action_required forever.
          GH_TOKEN: ${{ secrets.I18N_PIPELINE_TOKEN }}
          LOCALES_PATH: ${{ inputs.locales_path }}
        run: |
          set -euo pipefail
          BRANCH="chore/i18n-pipeline-$(date +%Y%m%d-%H%M%S)"
          umask 077
          GIT_CREDENTIAL_FILE=""
          cleanup_git_credentials() {
            git config --local --unset-all credential.helper >/dev/null 2>&1 || true
            if [ -n "$GIT_CREDENTIAL_FILE" ]; then
              rm -f "$GIT_CREDENTIAL_FILE"
            fi
          }
          trap cleanup_git_credentials EXIT
          GIT_CREDENTIAL_FILE=$(mktemp "$RUNNER_TEMP/i18n-git-credentials.XXXXXX")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$LOCALES_PATH/" .polyglot-cache.json src/ || true
          git commit -m "chore(i18n): sync + translate"
          # Keep the PAT out of process arguments. The ephemeral credential
          # file is created atomically as mode 0600 and removed immediately
          # after the push; the EXIT trap remains as failure-path cleanup.
          printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$GIT_CREDENTIAL_FILE"
          git config --local credential.helper "store --file=$GIT_CREDENTIAL_FILE"
          git push "https://github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          cleanup_git_credentials
          trap - EXIT
          cat > "$RUNNER_TEMP/i18n-pr-body.md" <<'PR_BODY_EOF'
          Automated i18n pipeline: synced locale files, translated via Gemini, regenerated types.

          Every run is a full snapshot of the same translation state, so this PR
          supersedes all older open `chore/i18n-pipeline-*` PRs. The same run closes
          them and deletes their branches in the step right after this one
          (CEL-1259). No comment is posted on each close — a bulk drain of a large
          backlog would trip GitHub's secondary rate limit on content creation, so
          the supersession notice lives here instead.
          PR_BODY_EOF
          # REST, not `gh pr create`: this keeps the token contract limited to
          # repository Contents and Pull requests permissions. Run 33157661915
          # proved why checkout credentials must be disabled: github.token
          # authenticated the push while a shadowed stale PAT failed this REST
          # call with HTTP 401.
          if ! PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/pulls" \
            -f title="chore(i18n): sync + translate" \
            -F body=@"$RUNNER_TEMP/i18n-pr-body.md" \
            -f base="${GITHUB_REF_NAME}" \
            -f head="$BRANCH" \
            --jq '.number'); then
            echo "::error::PR creation failed; deleting pushed branch $BRANCH"
            if ! gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$BRANCH" >/dev/null; then
              echo "::warning::Could not delete orphan branch $BRANCH after PR creation failed; remove it manually."
            fi
            exit 1
          fi
          echo "Opened PR #$PR_NUMBER"
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "::warning::Could not parse a PR number out of the create response; predecessors will be left for the next run to close."
              PR_NUMBER=""
              ;;
          esac
          {
            echo "pr_number=$PR_NUMBER"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"

      # CEL-1259 step 1/3 — close the predecessor bot PRs the PR above
      # supersedes. Without this the queue only grows (producer-dashboard hit
      # 151 open `chore/i18n-pipeline-*` PRs / 170 branches).
      #
      # `gh api --paginate` rather than `gh pr list`: the latter silently caps at
      # its default `--limit 30`, which on producer-dashboard's live backlog
      # matched 27 of 151 — a partial drain that never converges, and zero drain
      # for any repo whose 30 newest open PRs are all non-i18n.
      #
      # Gated on a parsed `pr_number` and skips that number *and* this run's
      # branch, so it can never close the PR the previous step just opened.
      #
      # Deliberately fail-safe: `continue-on-error` at the step level plus
      # explicit fallback handling + `::warning::` around both the list and the
      # close/delete-branch calls, so a transient `gh` failure (rate limit, a PR
      # someone already merged/closed by hand) degrades to a warning instead of
      # reddening the whole pipeline. Scoped to `changed == 'true'` — a no-diff
      # run opens nothing, so it has nothing to supersede.
      - name: Close predecessor i18n pipeline PRs
        if: success() && steps.diff.outputs.changed == 'true' && steps.create_pr.outputs.pr_number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          NEW_BRANCH: ${{ steps.create_pr.outputs.branch }}
        run: |
          set -u
          PREDECESSORS=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=${GITHUB_REF_NAME}&per_page=100" \
            --jq '.[] | select((.head.ref | startswith("chore/i18n-pipeline-")) and .head.repo.full_name == env.GITHUB_REPOSITORY) | "\(.number) \(.head.ref)"') || {
            echo "::warning::Failed to list predecessor i18n pipeline PRs; skipping close step."
            PREDECESSORS=""
          }
          if [ -z "$PREDECESSORS" ]; then
            echo "No open i18n pipeline PRs found."
            exit 0
          fi
          TOTAL=$(printf '%s\n' "$PREDECESSORS" | grep -c . || true)
          echo "Found $TOTAL open i18n pipeline PR(s), including #$NEW_PR_NUMBER opened by this run."
          # Each close is 2 mutating calls (close + ref delete). Pace them once
          # the backlog is large so a first-time drain of a repo with >100
          # predecessors stays clear of GitHub's secondary rate limits.
          THROTTLE=no
          if [ "$TOTAL" -gt 50 ]; then
            THROTTLE=yes
            echo "Backlog exceeds 50 PRs — pacing closes at 1s intervals."
          fi
          printf '%s\n' "$PREDECESSORS" | while read -r NUM BRANCH; do
            [ -n "$NUM" ] || continue
            if [ "$NUM" = "$NEW_PR_NUMBER" ] || [ "$BRANCH" = "$NEW_BRANCH" ]; then
              echo "Skipping PR #$NUM ($BRANCH) — opened by this run."
              continue
            fi
            echo "Closing predecessor PR #$NUM ($BRANCH)"
            if ! gh pr close "$NUM" --delete-branch; then
              echo "::warning::gh pr close failed for predecessor PR #$NUM ($BRANCH) — it may still be open, or it closed but its branch $BRANCH was not deleted. Check manually."
            fi
            if [ "$THROTTLE" = "yes" ]; then
              sleep 1
            fi
          done

      # CEL-1259 step 3/3 — flip auto-merge on the fresh PR so it lands the
      # moment its required checks go green. Only meaningful when the PR was
      # authored with I18N_PIPELINE_TOKEN (step 2): a github.token PR never
      # gets CI, so the reusable workflow requires the PAT at launch.
      # `allow_auto_merge` is enabled on all three consumer repos (2026-08-27).
      - name: Enable auto-merge on the new PR
        if: success() && steps.diff.outputs.changed == 'true' && steps.create_pr.outputs.pr_number != ''
        continue-on-error: true
        env:
          # The auto-merge step uses github.token for branch-rule REST probes
          # and the GraphQL mutation. The PAT contract stops at branch push and
          # REST PR creation.
          GH_TOKEN: ${{ github.token }}
          NEW_PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
        run: |
          set -u
          # Refuse to arm auto-merge unless the base branch has required
          # status checks. With none, GitHub either rejects the mutation (the
          # PR is immediately mergeable) or — in the brief window while
          # mergeability is still UNKNOWN — merges instantly with zero gates,
          # and that push triggers the consumers' production deploy workflows.
          RULES=0
          if RULES_QUERY=$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/${GITHUB_REF_NAME}" \
            --jq 'if type == "array" then [.[] | select(type == "object") | select(.type? == "required_status_checks") | .parameters? | select(type == "object") | .required_status_checks? | select(type == "array") | .[] | select(type == "object") | select((.context? | type) == "string" and (.context | length) > 0)] | length else 0 end' 2>/dev/null); then
            case "$RULES_QUERY" in
              ''|*[!0-9]*) ;;
              *) RULES="$RULES_QUERY" ;;
            esac
          fi
          CLASSIC=0
          if CLASSIC_QUERY=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/protection/required_status_checks" \
            --jq 'if (.checks? | type) == "array" then [.checks[] | select((.context? | type) == "string" and (.context | length) > 0)] | length else 0 end' 2>/dev/null); then
            case "$CLASSIC_QUERY" in
              ''|*[!0-9]*) ;;
              *) CLASSIC="$CLASSIC_QUERY" ;;
            esac
          fi
          if [ "${RULES:-0}" = "0" ] && [ "${CLASSIC:-0}" = "0" ]; then
            echo "::warning::${GITHUB_REF_NAME} has no required status checks — refusing to arm auto-merge (it would merge ungated and deploy). Add branch protection or a ruleset requiring CI, then auto-merge activates on the next run."
            exit 0
          fi
          if ! gh pr merge "$NEW_PR_NUMBER" --auto --squash; then
            echo "::warning::Could not enable auto-merge on PR #$NEW_PR_NUMBER — merge it manually."
          fi

  # CEL-384 prong 2: alert on workflow failure so the next silent-failure
  # incident becomes a 15-minute discovery instead of 7-20 days (CEL-361 /
  # CEL-382). Routes through the existing discord-notify reusable so it
  # lands in the same Discord forum the team already monitors.
  #
  # `workflow_name` is passed explicitly because `context.workflow` inside the
  # nested reusable resolves to "Discord Notification" (the reusable's own
  # name), not the failing pipeline's name. Caught by CEL-384 reviewers A + B.
  #
  alert-on-failure:
    needs: sync-translate
    if: ${{ failure() }}
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: ci_failure
      status: failure
      tags: infra
      workflow_name: ${{ github.workflow }}
