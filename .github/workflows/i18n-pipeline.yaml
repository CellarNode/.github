name: i18n — Sync + Translate

# Consumer requirements (CEL-436 / CEL-449):
#
#   1. `i18next-cli` AND `polyglot-i18n` MUST be present in the
#      consumer's `devDependencies`. pnpm exec resolves to the
#      lockfile-pinned versions; no global fallback. Current consumers:
#      producer-dashboard, importer-dashboard, cellarnode-public-site.
#
#   2. The caller MUST forward `GOOGLE_API_KEY` AND `NPM_TOKEN` via
#      `secrets: inherit` (CEL-361). NPM_TOKEN is needed for pnpm
#      install to authenticate against private `@cellarnode/*` packages.
#
#   3. OPTIONAL (CEL-1551): a `format:i18n` script. Define it if the
#      consumer's formatter would reformat any file this pipeline
#      regenerates; today that is `src/@types/resources.d.ts`, because
#      `i18next-cli types` always emits quoted interface keys that oxfmt
#      unquotes. Without the script, bot PRs land generated files that
#      fail the consumer's own format gate (importer PR #283). The step
#      is invoked as `pnpm run --if-present -s format:i18n`, so a repo
#      that defines no script is unaffected. Three constraints bind any
#      repo that DOES define one:
#
#        a. Scope it to generated paths only. It must never be a
#           repo-wide format, which would drag unrelated source churn
#           into an automated translation PR.
#        b. Keep it inside `$LOCALES_PATH/`, `.polyglot-cache.json`, or
#           `src/`. Change detection diffs tracked-file changes and the
#           commit stages only those three paths, so an out-of-scope
#           write to a tracked file is silently dropped when in-scope
#           changes exist, reddens the run when it is the only change,
#           and a new untracked file outside them is a green no-op.
#        c. The target MUST NOT be excluded by the consumer's own
#           formatter ignore config. oxfmt exits 2 on a fully-excluded
#           target ("Expected at least one target file"), and this step
#           carries no `|| true`, so an ignore entry left in place while
#           `format:i18n` points at that path reddens EVERY run of this
#           pipeline for that repo, including runs with no diff. Remove
#           the ignore entry and add the script in the same change.
#
# Misconfiguration surfaces as a RED workflow run (CEL-434 removed the
# `|| true` that previously masked these failures).

on:
  workflow_call:
    inputs:
      force-translate:
        description: 'Force retranslate all keys'
        required: false
        type: boolean
        default: false
      context:
        description: 'Domain context for Gemini translation'
        required: false
        type: string
        default: 'Beverage industry B2B platform'
      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '22'
      locales_path:
        description: 'Path to locales directory'
        required: false
        type: string
        default: 'public/locales'
      target_languages:
        description: 'Comma-separated target language codes'
        required: false
        type: string
        default: 'zh,fr,de,it,es,sv,ru'
    secrets:
      GOOGLE_API_KEY:
        required: true
      NPM_TOKEN:
        description: 'npm token used for private @cellarnode/* package installs (.npmrc env-var substitution)'
        # CEL-384 Prong 1a: flipped to required:true after CEL-361/382/383
        # confirmed all current callers (producer, importer, public-site) use
        # `secrets: inherit`, which auto-forwards NPM_TOKEN from org-level
        # secrets regardless of whether the consumer needs it at runtime.
        # GitHub Actions' native launch-time validation gives a clearer
        # named-secret error than the in-job pre-flight below, which now acts
        # as defense-in-depth for the "secret declared but empty" case.
        required: true
      DISCORD_WEBHOOK_URL:
        description: 'Discord webhook credential'
        required: false
      I18N_PIPELINE_TOKEN:
        description: >-
          Fine-grained PAT (Contents RW + Pull requests RW on the consumer
          repos) used to push the generated branch and create its PR through
          REST so `on: pull_request` CI fires. Callers on `secrets: inherit`
          forward the organization secret automatically; explicit-map callers
          must forward it by name.
        required: true

jobs:
  sync-translate:
    runs-on: ubuntu-latest
    # CEL-1259 step 3 — when auto-merge lands our own "chore(i18n): sync +
    # translate" squash on the base branch, the callers' `push` +
    # `paths: ['src/**']` trigger would re-run this whole pipeline (bounded:
    # the committed .polyglot-cache.json makes it a cache-hit no-diff run,
    # but it still costs an install + Gemini pass). Skip that self-echo run.
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(i18n): sync + translate')"
    # CEL-1259 — serialize per consumer repo. `github.repository` in a reusable
    # workflow resolves to the *caller's* repo, so each consumer gets its own
    # queue and consumers never block each other. Without this, two overlapping
    # runs would each create a PR and each close step excludes only its OWN new
    # PR — so the runs close each other's fresh PR and the repo can end up with
    # churned or zero open i18n PRs. `cancel-in-progress: false` because
    # cancelling mid-run can leave a pushed branch with no PR attached to it.
    concurrency:
      group: i18n-pipeline-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    # Forward NPM_TOKEN so .npmrc env-var substitution finds it during
    # pnpm install. Caller side declares the secret via `secrets: inherit`
    # (or an explicit `secrets: NPM_TOKEN: ${{ secrets.NPM_TOKEN }}` map).
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Create PR must authenticate both its push and REST call with the
          # same token. Otherwise checkout's persisted github.token can make
          # the push succeed while a stale PAT fails seconds later.
          persist-credentials: false

      # CEL-384 prong 1b: catch the most-common failure mode — caller did not
      # forward NPM_TOKEN but the repo has private @cellarnode/* deps — and
      # fail fast with a named-secret error instead of the npm-404 misdirection
      # that ate ~20 days of importer (CEL-382) and ~7 days of producer (CEL-361).
      # Public-only consumers (e.g., cellarnode-public-site, which uses only
      # @cellarnode/i18n / @cellarnode/auth / @cellarnode/beverage-utils) skip
      # this gate because their deps install from public npm without auth.
      - name: Verify NPM_TOKEN forwarding for private deps
        run: |
          set -eu
          PRIVATE_REFS=$(find . -name package.json -not -path '*/node_modules/*' \
            -exec grep -l '"@cellarnode/\(ui\|finance\)"' {} + 2>/dev/null || true)
          if [ -n "$PRIVATE_REFS" ]; then
            if [ -z "${NPM_TOKEN:-}" ]; then
              echo "::error title=NPM_TOKEN missing::Private @cellarnode/* dep detected but NPM_TOKEN is empty."
              echo "::error::Found in:"
              echo "$PRIVATE_REFS" | sed 's/^/::error::  /'
              echo "::error::Caller workflow must forward NPM_TOKEN via 'secrets: inherit' (recommended) or an explicit secrets map."
              echo "::error::See CEL-361 / CEL-382 / CEL-383 for the recurring failure mode this prevents."
              exit 1
            fi
            echo "Private @cellarnode/* deps detected in:"
            echo "$PRIVATE_REFS" | sed 's/^/  /'
            echo "NPM_TOKEN forwarding verified."
          else
            echo "No private @cellarnode/* deps detected; NPM_TOKEN not required for this build."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      # CEL-449 — drop the `npm install -g polyglot-i18n` step. All 3
      # consumers now have `polyglot-i18n` as a local devDep (PR #172,
      # #89, #22), so the translate step below can resolve via `pnpm
      # exec` against the lockfile-pinned version. Same hardening as
      # CEL-436 did for `i18next-cli`. With both tools lockfile-pinned,
      # this workflow no longer carries any floating npm dependencies.
      #
      # CEL-436 — `pnpm exec` (not `npx`) resolves to the consumer's
      # local `i18next-cli` devDep, so the workflow uses the lockfile-
      # pinned version deterministically. `npx` would silently install
      # from the live registry if the global install were missing.
      - name: Sync locale files
        run: pnpm exec i18next-cli sync

      - name: Translate new/changed keys
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FORCE_TRANSLATE: ${{ inputs.force-translate }}
          LOCALES_PATH: ${{ inputs.locales_path }}
          TARGET_LANGUAGES: ${{ inputs.target_languages }}
          TRANSLATION_CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          BASE_CACHE="$RUNNER_TEMP/polyglot-cache-base.json"
          if [ -f .polyglot-cache.json ]; then
            cp .polyglot-cache.json "$BASE_CACHE"
          else
            printf '{}\n' > "$BASE_CACHE"
          fi

          # CEL-449 — `pnpm exec` resolves to the consumer's local
          # `polyglot-i18n` devDep (lockfile-pinned). Was a bare
          # invocation reading from the global install before CEL-449.
          # polyglot-i18n 0.2.x stores source hashes in one cache shared by all
          # target languages. A multi-language invocation updates that cache
          # after its first language, causing later languages to skip changed
          # keys they already contain. Give every language the same original
          # cache snapshot, then keep one equivalent updated copy.
          IFS=',' read -r -a languages <<< "$TARGET_LANGUAGES"
          updated_cache=""
          index=0
          for language in "${languages[@]}"; do
            language="$(printf '%s' "$language" | tr -d '[:space:]')"
            if [[ ! "$language" =~ ^[a-z]{2}(-[A-Za-z]{2,})?$ ]]; then
              echo "::error::Invalid target language code: $language"
              exit 1
            fi

            language_cache="$RUNNER_TEMP/polyglot-cache-$index.json"
            cp "$BASE_CACHE" "$language_cache"
            translate_args=(
              --input "./$LOCALES_PATH/en"
              --output-languages "$language"
              --provider gemini
              --api-key "$GOOGLE_API_KEY"
              --context "$TRANSLATION_CONTEXT"
              --cache-file "$language_cache"
            )
            if [ "$FORCE_TRANSLATE" = "true" ]; then
              translate_args+=(--force)
            fi
            pnpm exec polyglot-i18n translate "${translate_args[@]}"
            updated_cache="$language_cache"
            index=$((index + 1))
          done

          if [ -z "$updated_cache" ]; then
            echo "::error::At least one target language is required"
            exit 1
          fi
          cp "$updated_cache" .polyglot-cache.json

      # CEL-434 — `|| true` REMOVED. Previously this step silently swallowed
      # failures. When `i18next-cli types` failed (e.g., because the consuming
      # repo lacked `i18next-cli` as a devDep so the CLI couldn't resolve the
      # project-specific TS config), the workflow continued past this step
      # without regenerating `src/@types/resources.d.ts`. Bot PRs then landed
      # with locale changes but no regenerated types — producing the
      # CEL-417 producer-dashboard scenario where typed i18n key checking
      # silently degraded over weeks. Failure here now correctly turns the
      # whole pipeline red so the regression surfaces at PR time.
      #
      # CEL-436 — `npx` → `pnpm exec` per the same rationale as the sync
      # step above. Uses the consumer's locked i18next-cli devDep.
      - name: Generate TypeScript types
        run: pnpm exec i18next-cli types

      # CEL-1551 — the `i18next-cli types` emitter is not format-stable: it
      # always writes quoted interface keys (`"auth": { ... }`), which the
      # consumers' formatter then unquotes. Bot PRs therefore landed types
      # that failed the consumer's own `make format-check`, and importer
      # PR #283 had to be rescued by hand with a follow-up format commit
      # (8024be9d) before it could merge. Formatting here, between generation
      # and the `git add` below, makes the committed types house-formatted in
      # the same run that regenerates them.
      #
      # Contract: opt-in, and scoped by the consumer rather than by us. A repo
      # with no `format:i18n` script behaves exactly as it did before this
      # step existed. A repo that defines one owns which paths it touches, and
      # that script must name only generated paths. It must never be a
      # repo-wide format, which would drag unrelated source churn into an
      # automated translation PR. The full opt-in contract, including the two
      # ways a badly-wired script turns this step permanently red (a write
      # outside the staged paths, and a target excluded by the consumer's own
      # formatter ignore config), is requirement 3 at the top of this file.
      #
      # `--if-present` must precede the script name. pnpm only parses its own
      # flags before the script name; placed after it, pnpm forwards the flag
      # to the script and a missing script still exits 1. Verified on pnpm
      # 10.32.1 (importer-dashboard) and 10.28.2 (producer-dashboard,
      # cellarnode-public-site); `pnpm/action-setup@v4` above pins no version,
      # so each consumer runs its own `packageManager` pnpm. Flag-parsing
      # semantics are unchanged across 10.x. A script that exists and fails
      # still exits non-zero and reddens the pipeline, matching the CEL-434
      # posture of the step above.
      - name: Format regenerated types
        run: pnpm run --if-present -s format:i18n

      - name: Check for changes
        id: diff
        run: |
          git diff --exit-code && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      # CEL-1259 step 1/3 — the replacement PR is opened FIRST, and only then
      # are the predecessors it supersedes closed (next step). Ordering matters:
      # closing first meant a failed `git push` / `gh pr create` destroyed every
      # predecessor PR *and* its branch with nothing opened in their place.
      #
      # The branch name carries seconds (`%H%M%S`, was `%H%M`) so two runs that
      # reach this step inside the same minute cannot collide on one branch name
      # and turn the second push into a non-fast-forward rejection.
      - name: Create PR
        id: create_pr
        if: steps.diff.outputs.changed == 'true'
        env:
          # CEL-1259 step 2/3 — the organization PAT is the sole credential for
          # branch push and REST PR creation. github.token-authored PRs never
          # trigger `on: pull_request`, so falling back would park CI at
          # action_required forever.
          GH_TOKEN: ${{ secrets.I18N_PIPELINE_TOKEN }}
          LOCALES_PATH: ${{ inputs.locales_path }}
        run: |
          set -euo pipefail
          BRANCH="chore/i18n-pipeline-$(date +%Y%m%d-%H%M%S)"
          umask 077
          GIT_CREDENTIAL_FILE=""
          cleanup_git_credentials() {
            git config --local --unset-all credential.helper >/dev/null 2>&1 || true
            if [ -n "$GIT_CREDENTIAL_FILE" ]; then
              rm -f "$GIT_CREDENTIAL_FILE"
            fi
          }
          trap cleanup_git_credentials EXIT
          GIT_CREDENTIAL_FILE=$(mktemp "$RUNNER_TEMP/i18n-git-credentials.XXXXXX")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$LOCALES_PATH/" .polyglot-cache.json src/ || true
          git commit -m "chore(i18n): sync + translate"
          # Keep the PAT out of process arguments. The ephemeral credential
          # file is created atomically as mode 0600 and removed immediately
          # after the push; the EXIT trap remains as failure-path cleanup.
          printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$GIT_CREDENTIAL_FILE"
          git config --local credential.helper "store --file=$GIT_CREDENTIAL_FILE"
          git push "https://github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          cleanup_git_credentials
          trap - EXIT
          cat > "$RUNNER_TEMP/i18n-pr-body.md" <<'PR_BODY_EOF'
          Automated i18n pipeline: synced locale files, translated via Gemini, regenerated types.

          Every run is a full snapshot of the same translation state, so this PR
          supersedes all older open `chore/i18n-pipeline-*` PRs. The same run closes
          them and deletes their branches in the step right after this one
          (CEL-1259). No comment is posted on each close — a bulk drain of a large
          backlog would trip GitHub's secondary rate limit on content creation, so
          the supersession notice lives here instead.
          PR_BODY_EOF
          # REST, not `gh pr create`: this keeps the token contract limited to
          # repository Contents and Pull requests permissions. Run 33157661915
          # proved why checkout credentials must be disabled: github.token
          # authenticated the push while a shadowed stale PAT failed this REST
          # call with HTTP 401.
          PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/pulls" \
            -f title="chore(i18n): sync + translate" \
            -F body=@"$RUNNER_TEMP/i18n-pr-body.md" \
            -f base="${GITHUB_REF_NAME}" \
            -f head="$BRANCH" \
            --jq '.number')
          echo "Opened PR #$PR_NUMBER"
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "::warning::Could not parse a PR number out of the create response; predecessors will be left for the next run to close."
              PR_NUMBER=""
              ;;
          esac
          {
            echo "pr_number=$PR_NUMBER"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"

      # CEL-1259 step 1/3 — close the predecessor bot PRs the PR above
      # supersedes. Without this the queue only grows (producer-dashboard hit
      # 151 open `chore/i18n-pipeline-*` PRs / 170 branches).
      #
      # `gh api --paginate` rather than `gh pr list`: the latter silently caps at
      # its default `--limit 30`, which on producer-dashboard's live backlog
      # matched 27 of 151 — a partial drain that never converges, and zero drain
      # for any repo whose 30 newest open PRs are all non-i18n.
      #
      # Gated on a parsed `pr_number` and skips that number *and* this run's
      # branch, so it can never close the PR the previous step just opened.
      #
      # Deliberately fail-safe: `continue-on-error` at the step level plus
      # explicit fallback handling + `::warning::` around both the list and the
      # close/delete-branch calls, so a transient `gh` failure (rate limit, a PR
      # someone already merged/closed by hand) degrades to a warning instead of
      # reddening the whole pipeline. Scoped to `changed == 'true'` — a no-diff
      # run opens nothing, so it has nothing to supersede.
      - name: Close predecessor i18n pipeline PRs
        if: success() && steps.diff.outputs.changed == 'true' && steps.create_pr.outputs.pr_number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          NEW_BRANCH: ${{ steps.create_pr.outputs.branch }}
        run: |
          set -u
          PREDECESSORS=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=${GITHUB_REF_NAME}&per_page=100" \
            --jq '.[] | select((.head.ref | startswith("chore/i18n-pipeline-")) and .head.repo.full_name == env.GITHUB_REPOSITORY) | "\(.number) \(.head.ref)"') || {
            echo "::warning::Failed to list predecessor i18n pipeline PRs; skipping close step."
            PREDECESSORS=""
          }
          if [ -z "$PREDECESSORS" ]; then
            echo "No open i18n pipeline PRs found."
            exit 0
          fi
          TOTAL=$(printf '%s\n' "$PREDECESSORS" | grep -c . || true)
          echo "Found $TOTAL open i18n pipeline PR(s), including #$NEW_PR_NUMBER opened by this run."
          # Each close is 2 mutating calls (close + ref delete). Pace them once
          # the backlog is large so a first-time drain of a repo with >100
          # predecessors stays clear of GitHub's secondary rate limits.
          THROTTLE=no
          if [ "$TOTAL" -gt 50 ]; then
            THROTTLE=yes
            echo "Backlog exceeds 50 PRs — pacing closes at 1s intervals."
          fi
          printf '%s\n' "$PREDECESSORS" | while read -r NUM BRANCH; do
            [ -n "$NUM" ] || continue
            if [ "$NUM" = "$NEW_PR_NUMBER" ] || [ "$BRANCH" = "$NEW_BRANCH" ]; then
              echo "Skipping PR #$NUM ($BRANCH) — opened by this run."
              continue
            fi
            echo "Closing predecessor PR #$NUM ($BRANCH)"
            if ! gh pr close "$NUM" --delete-branch; then
              echo "::warning::gh pr close failed for predecessor PR #$NUM ($BRANCH) — it may still be open, or it closed but its branch $BRANCH was not deleted. Check manually."
            fi
            if [ "$THROTTLE" = "yes" ]; then
              sleep 1
            fi
          done

      # CEL-1259 step 3/3 — flip auto-merge on the fresh PR so it lands the
      # moment its required checks go green. Only meaningful when the PR was
      # authored with I18N_PIPELINE_TOKEN (step 2): a github.token PR never
      # gets CI, so the reusable workflow requires the PAT at launch.
      # `allow_auto_merge` is enabled on all three consumer repos (2026-08-27).
      - name: Enable auto-merge on the new PR
        if: success() && steps.diff.outputs.changed == 'true' && steps.create_pr.outputs.pr_number != ''
        continue-on-error: true
        env:
          # The auto-merge step uses github.token for branch-rule REST probes
          # and the GraphQL mutation. The PAT contract stops at branch push and
          # REST PR creation.
          GH_TOKEN: ${{ github.token }}
          NEW_PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
        run: |
          set -u
          # Refuse to arm auto-merge unless the base branch has required
          # status checks. With none, GitHub either rejects the mutation (the
          # PR is immediately mergeable) or — in the brief window while
          # mergeability is still UNKNOWN — merges instantly with zero gates,
          # and that push triggers the consumers' production deploy workflows.
          RULES=0
          if RULES_QUERY=$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/${GITHUB_REF_NAME}" \
            --jq '[.[] | select(.type == "required_status_checks")] | length' 2>/dev/null); then
            case "$RULES_QUERY" in
              ''|*[!0-9]*) ;;
              *) RULES="$RULES_QUERY" ;;
            esac
          fi
          CLASSIC=0
          if CLASSIC_QUERY=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/protection/required_status_checks" \
            --jq '.checks | length' 2>/dev/null); then
            case "$CLASSIC_QUERY" in
              ''|*[!0-9]*) ;;
              *) CLASSIC="$CLASSIC_QUERY" ;;
            esac
          fi
          if [ "${RULES:-0}" = "0" ] && [ "${CLASSIC:-0}" = "0" ]; then
            echo "::warning::${GITHUB_REF_NAME} has no required status checks — refusing to arm auto-merge (it would merge ungated and deploy). Add branch protection or a ruleset requiring CI, then auto-merge activates on the next run."
            exit 0
          fi
          if ! gh pr merge "$NEW_PR_NUMBER" --auto --squash; then
            echo "::warning::Could not enable auto-merge on PR #$NEW_PR_NUMBER — merge it manually."
          fi

  # CEL-384 prong 2: alert on workflow failure so the next silent-failure
  # incident becomes a 15-minute discovery instead of 7-20 days (CEL-361 /
  # CEL-382). Routes through the existing discord-notify reusable so it
  # lands in the same Discord forum the team already monitors.
  #
  # `workflow_name` is passed explicitly because `context.workflow` inside the
  # nested reusable resolves to "Discord Notification" (the reusable's own
  # name), not the failing pipeline's name. Caught by CEL-384 reviewers A + B.
  #
  alert-on-failure:
    needs: sync-translate
    if: ${{ failure() }}
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: ci_failure
      status: failure
      tags: infra
      workflow_name: ${{ github.workflow }}
