name: Build and Deploy Cloud Run

on:
  workflow_call:
    inputs:
      app_name:
        description: "Application name (used for image name and ArgoCD app)"
        required: true
        type: string
      deploy_path:
        description: "ArgoCD kustomize path prefix in crossplane-gcloud repo"
        required: false
        type: string
        default: "./deploy/installations"
      argocd_project:
        description: "ArgoCD project name"
        required: false
        type: string
        default: "products"
      discord_tags:
        description: "Comma-separated Discord forum tag names (e.g. backend,infra)"
        required: false
        type: string
        default: ""
      argocd_deploy:
        description: "CEL-2322: run the ArgoCD deploy job (`argocd app create --upsert`, needs ARGO_API_KEY). Set false for an app on the pull model (Argo CD Image Updater): the build still pushes the image, the cluster pulls it, and no ArgoCD credential is needed. Default true keeps every existing caller unchanged."
        required: false
        type: boolean
        default: true
    secrets:
      ARGO_API_KEY:
        description: "ArgoCD API token of the `github` account (org secret ARGO_API_KEY, CEL-2320). Optional so fork PRs (no secrets) still run the no-push build jobs; the deploy step fails fast when it is empty. Callers pass it explicitly or with `secrets: inherit`."
        required: false
      DISCORD_WEBHOOK_URL:
        description: "Discord webhook credential"
        required: false

env:
  CONTAINER_REGISTRY: europe-north1-docker.pkg.dev
  PROJECT_ID: festive-terrain-478011-h0
  CONTAINER_REPOSITORY: beveriq

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image_tag=pr-${{ github.event.pull_request.number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              echo "should_push=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_push=false" >> "$GITHUB_OUTPUT"
            fi
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=true" >> "$GITHUB_OUTPUT"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
              echo "push_latest=true" >> "$GITHUB_OUTPUT"
            else
              # CEL-2322: a bare `<sha7>` tag means "built from main" (see deploy-backend.yaml): other refs get a branch- prefix.
              SLUG=$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9\n' '-' | tr -s '-' | sed 's/^-*//; s/-*$//' | cut -c1-30 | sed 's/-*$//')
              echo "image_tag=branch-${SLUG:-ref}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
              echo "push_latest=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        if: steps.vars.outputs.should_push == 'true'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: "projects/1040576468442/locations/global/workloadIdentityPools/iamwipp-pipelines/providers/iamwipp-github-pipelines-beveriq"
          service_account: "pipelines@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"
          token_format: "access_token"

      - name: Login to Artifact Registry
        if: steps.vars.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push image
        if: steps.vars.outputs.should_push == 'true'
        shell: bash
        run: |
          APP='${{ inputs.app_name }}'
          TAG='${{ steps.vars.outputs.image_tag }}'
          REGISTRY="${{ env.CONTAINER_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.CONTAINER_REPOSITORY }}"
          CACHE_REF="${REGISTRY}/${APP}-cache:latest"

          TAGS="--tag ${REGISTRY}/${APP}:${TAG}"
          if [ "${{ steps.vars.outputs.push_latest }}" = "true" ]; then
            TAGS="${TAGS} --tag ${REGISTRY}/${APP}:latest"
          fi

          docker buildx build \
            --push \
            ${TAGS} \
            --cache-from="type=registry,ref=${CACHE_REF}" \
            --cache-to="type=registry,ref=${CACHE_REF},mode=max" \
            .

      - name: Build image (no push)
        if: steps.vars.outputs.should_push != 'true'
        run: docker buildx build .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # CEL-2322: PRODUCTION deploys only from main. A workflow_dispatch on another branch still builds and pushes its
    # `branch-<slug>-<sha7>` image (see the tag step), so that image stays available for a future preview/staging
    # environment, but it never reaches production: see `deploy-skipped-notice`.
    # `argocd_deploy: false` (pull-model apps, CEL-2322) skips this job and with it the ARGO_API_KEY requirement.
    if: >-
      inputs.argocd_deploy &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Setup ArgoCD CLI
        uses: imajeetyadav/argocd-cli@v1
        with:
          version: v3.2.1

      - name: Deploy to ArgoCD
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGO_API_KEY }}
          ARGOCD_URL: argo.anli.es
        run: |
          # CEL-2320: ARGO_API_KEY is an optional workflow secret so fork PRs (no secrets) still reach the no-push build
          # jobs; only THIS deploy step needs it, and it fails fast with a clear message. Never echo the value.
          if [ -z "${ARGOCD_AUTH_TOKEN:-}" ]; then
            echo "::error title=ARGO_API_KEY missing::The org secret ARGO_API_KEY is not available to this repository (add the repo to the secret's selected repositories, and pass it from the caller or use 'secrets: inherit')."
            exit 1
          fi
          APP='${{ inputs.app_name }}'
          REGISTRY="${{ env.CONTAINER_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.CONTAINER_REPOSITORY }}"
          TAG="${{ needs.build.outputs.image_tag }}"

          argocd app create --upsert ${APP}-cloudrun --server $ARGOCD_URL \
            --project ${{ inputs.argocd_project }} \
            --repo git@github.com:CellarNode/crossplane-gcloud.git \
            --path ${{ inputs.deploy_path }}/${APP}/ \
            --dest-server https://kubernetes.default.svc \
            --dest-namespace ${APP}-cloudrun \
            --kustomize-image "app-image=${REGISTRY}/${APP}:${TAG}" \
            --sync-policy auto \
            --sync-option CreateNamespace=true \
            --sync-option PruneLast=true

  deploy-skipped-notice:
    # CEL-2322: say clearly why a non-main dispatch did not deploy. Future preview path (not built yet): a SEPARATE
    # preview/staging ArgoCD project and namespace that deploys `branch-*` tags; this production workflow must never
    # grow a non-main deploy. Add an explicit opt-in input and a distinct app name/project for it when that exists.
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    steps:
      - name: Production deploys only from main
        env:
          REF_NAME: ${{ github.ref_name }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          echo "::notice title=Deploy skipped::Production deploys only from main. Built and pushed ${IMAGE_TAG} from ${REF_NAME}; it is NOT deployed. A future preview/staging environment can deploy branch-* tags."
          {
            echo "### Deploy skipped"
            echo "Production deploys only from \`main\`. This run built and pushed \`${IMAGE_TAG}\` from \`${REF_NAME}\` (kept for a future preview/staging environment) and did **not** deploy it."
          } >> "$GITHUB_STEP_SUMMARY"

  # --- Discord thread lifecycle ---

  discord-thread-open:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_open
      tags: ${{ inputs.discord_tags }}

  discord-build-update:
    needs: [build, discord-thread-open]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      needs.build.result != 'cancelled'
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_update
      status: ${{ needs.build.result }}

  discord-thread-close:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: thread_close
      status: ${{ github.event.pull_request.merged && 'merged' || 'closed' }}

  discord-deploy:
    # With argocd_deploy=false the `deploy` job is skipped by design: report the BUILD result (the image is pushed and the
    # cluster pulls it) instead of a misleading "skipped" warning.
    needs: [build, deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/discord-notify.yaml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    with:
      event: deploy
      status: ${{ inputs.argocd_deploy && needs.deploy.result || needs.build.result }}
      deploy_mode: ${{ inputs.argocd_deploy && 'deployed' || 'published' }}
      image_tag: ${{ needs.build.outputs.image_tag }}
      tags: ${{ inputs.discord_tags }}
